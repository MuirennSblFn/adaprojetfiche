  body{background:#fff;padding:0}
  .exp-top button, .no-print{display:none !important}
  .sheet .block{break-inside:avoid;border-color:#999}
  .trackcard input{border-bottom:1px solid #999}
}
</style></head>
<body>
<div class="exp-top no-print"><div><h1>${title}</h1><p class="exp-sub">Généré par la Forge de Personnage — Ashford &amp; Dirman Adventures</p></div>
<button class="printme" onclick="window.print()">🖨 Imprimer / Enregistrer en PDF</button></div>
${sheetHtml}
</body></html>`;
  }

  function buildExportText(){
    const lines=[];
    lines.push((s.identity.name||"Fiche de personnage")+" — Forge de Personnage (Ashford & Dirman Adventures)");
    lines.push("");
    const tmp = document.createElement("div");
    tmp.innerHTML = $("#sheet").innerHTML;
    tmp.querySelectorAll(".block").forEach(block=>{
      const h4 = block.querySelector("h4");
      lines.push("== "+(h4?h4.textContent:"")+" ==");
      lines.push(block.textContent.replace(h4?h4.textContent:"","").replace(/\s+/g," ").trim());
      lines.push("");
    });
    return lines.join("\n");
  }

  paintSheet();

  function paintSheet(){
    const civilBlocks = Object.keys(D.SKILL_CATEGORIES).map(cat=>`
      <div class="block"><h4>${cat}</h4><table class="simple"><tbody>
        ${D.SKILL_CATEGORIES[cat].map(sk=>{
          const base=s.civil[sk]||0, b=core.allSkillBonuses()[sk], tb=b?b.total:0;
          const capped=Math.min(100,base+tb), mastered=capped>=100, tot=mastered?80:capped;
          const title = b? b.parts.map(p=>`${p.label} ${p.amount>0?"+":""}${p.amount}`).join(", ") : "";
          return `<tr><td>${esc(sk)}${mastered?` <small style="color:var(--gold)">★</small>`:""}</td><td class="tabular" style="text-align:right" ${title?`title="${esc(title)}"`:""}>${tot}${mastered?` <small style="color:var(--gold)">(maîtrise)</small>`:(tb?` <small style="color:var(--gold)">(${base}${tb>0?"+":""}${tb})</small>`:"")}</td></tr>`;
        }).join("")}
      </tbody></table></div>`).join("");
    const masteredSkills = Object.keys(s.masteries||{}).filter(sk=> (s.masteries[sk]||[]).length);
    const masteriesBlock = masteredSkills.length ? `<div class="block"><h4>Maîtrises</h4>
      ${masteredSkills.map(sk=>`<p><b>${esc(sk)}</b><br>${(s.masteries[sk]||[]).map(esc).join("<br>")}</p>`).join("")}
     </div>` : "";
    const isWeaponBranch = b=> D.WEAPON_BRANCHES.some(w=>w.id===b.id);
    const weaponArbreRecap = `Points d'arbre : ${core.weaponArbreSpent()} / ${core.weaponArbrePoints()} — Points de maîtrise : ${core.weaponMasterySpent()} / ${core.weaponMasteryPoints()}`;
    const weaponBlocks = D.WEAPON_BRANCHES.concat(D.ARMOR_BRANCHES).filter(b=> (s.weapon.branches[b.id]||{}).unlocked).map(b=>{
      const bs=s.weapon.branches[b.id]; const classBonus=(s.guerrierWeaponId===b.id && core.hasClass("guerrier"))?10:0;
      const vampireBonus=(s.raceId==="vampire" && s.vampireChoice==="jeunesse")?10:0;
      const weapon = isWeaponBranch(b);
      const chancesBonus = weapon ? (bs.chances||0)*5 : 0;
      const m=Math.min(100,25+(bs.mastery||0)+classBonus+vampireBonus+chancesBonus);
      const dieLabel = weapon ? `${core.dieAtRank(bs.dieOverride||b.baseDie, bs.de||0)}${b.stat?` + mod. ${b.stat}`:""}` : "";
      return `<tr><td>${esc(b.name)}${classBonus?` <small style="color:var(--gold)">(+10 don)</small>`:""}${vampireBonus?` <small style="color:var(--gold)">(+10 fougue)</small>`:""}${dieLabel?` <small style="color:var(--ink-faint)">— ${esc(dieLabel)}</small>`:""}</td><td class="tabular" style="text-align:right">${m}%</td><td style="text-align:right">${(bs.chances+bs.de+bs.crit)>=9?"★ capacité":((bs.chances||0)+(bs.de||0)+(bs.crit||0))+"/9"}</td></tr>`;
    }).join("");
    const magicDie = core.magicDieForLevel(s.level||1);
    const magicArbreRecap = `Points d'arbre : ${core.magicArbreSpent()} / ${core.magicArbrePoints()} — Points de maîtrise : ${core.magicMasterySpent()} / ${core.magicMasteryPoints()} — Dé de magie (niveau ${s.level||1}) : ${esc(magicDie)}`;
    const intMod = core.statModFinal("INT");
    const magicBlocks = D.MAGIC_SCHOOLS.map(sc=> sc.sub.map(sub=>{
      const id=sc.id+"-"+sub; const bs=s.magic.schools[id];
      if(!bs||!bs.unlocked) return "";
      const m=Math.min(100,25+(bs.mastery||0));
      const dieLabel = `${magicDie}${(bs.dmgPts||0)>0?` +${bs.dmgPts}`:""} + mod. INT${intMod!=null?` (${intMod>=0?"+":""}${intMod})`:""}`;
      return `<tr><td>${esc(sc.name)} — ${esc(sub)} <small style="color:var(--ink-faint)">— ${esc(dieLabel)}</small></td><td class="tabular" style="text-align:right">${m}%</td></tr>`;
    }).join("")).join("");

    $("#sheet").innerHTML = `
     <div class="block">
      <h4>Identité</h4>
      <div style="display:flex;gap:1.1rem;flex-wrap:wrap;align-items:flex-start">
        ${s.identity.portrait?`<img src="${s.identity.portrait}" alt="Portrait du personnage" style="width:110px;height:110px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex:0 0 auto">`:""}
        <div class="two-col" style="flex:1 1 300px">
          <div><b>${esc(s.identity.name||"—")}</b><br>Joueur : ${esc(s.identity.player||"—")}<br>Alignement : ${esc(s.identity.align||"—")}</div>
          <div>Race : ${esc(race?race.name:"—")}<br>Classe : ${esc(cls?cls.name:"—")}${cls2?` / ${esc(cls2.name)}`:""}<br>Taille : ${esc(s.identity.height||"—")} · Yeux : ${esc(s.identity.eyes||"—")} · Cheveux : ${esc(s.identity.hair||"—")}</div>
        </div>
      </div>
     </div>

     <div class="block"><h4>Histoire</h4>
       ${s.identity.desc?`<p>${esc(s.identity.desc)}</p>`:""}
       ${s.historyText?`<p style="${s.identity.desc?"margin-top:.6rem":""}">${esc(s.historyText)}</p>`:""}
       ${(!s.identity.desc && !s.historyText)?"<p>—</p>":""}
     </div>

     <div class="block">
      <h4>Caractéristiques</h4>
      <div class="stat-grid">
       ${D.STATS.map(st=>`<div class="stat-card"><div class="lbl">${st}</div><div class="val tabular">${core.statFinal(st)??"–"}</div><div class="mod tabular">${core.statModFinal(st)!=null?((core.statModFinal(st)>=0?"+":"")+core.statModFinal(st)):""}</div></div>`).join("")}
      </div>
     </div>

     <div class="block">
      <h4>Suivi en jeu <small class="help" style="text-transform:none;letter-spacing:0">(ces valeurs évoluent en jeu — mettez-les à jour ici)</small></h4>
      <div class="stat-grid">
       <div class="trackcard"><div class="lbl">Niveau</div><input type="number" id="trk-level" min="1" value="${s.level||1}"><div class="sub">${core.nextLevelXP()!=null?("seuil niv. suiv. : "+core.nextLevelXP()+" XP"):""}</div></div>
       <div class="trackcard"><div class="lbl">Expérience</div><input type="number" id="trk-xp" min="0" value="${s.xp||0}"><div class="sub">points d'XP cumulés</div></div>
       <div class="trackcard"><div class="lbl">PV actuels</div><input type="number" id="trk-pv" value="${core.currentPV()??""}"><div class="sub">départ : ${core.pvValue()??"–"}</div></div>
       <div class="trackcard"><div class="lbl">Or actuel</div><input type="number" id="trk-gold" value="${core.currentGold()??""}"><div class="sub">départ : ${core.goldStart()} PO</div></div>
      </div>
      <button type="button" class="btn no-print" id="levelUpBtn" style="margin-top:.9rem">⬆ Passage de niveau (niveau ${(s.level||1)} → ${(s.level||1)+1})</button>
      <p class="help no-print" style="margin-top:.4rem">Calcule et applique automatiquement les PV, la caractéristique éventuelle et les nouveaux points de compétences/maîtrise gagnés (Chapitre X, p.82).</p>
     </div>

     <div class="block"><h4>Langues</h4><p>${(s.languages&&s.languages.length)? s.languages.map(esc).join(" · ") : "Aucune sélectionnée ("+core.languageCount()+" disponible(s))"}</p></div>

     <div class="block"><h4>Traits raciaux</h4><p>${race? race.traits.map(esc).join(" · ") : "—"}</p>
       ${(()=>{ if(s.raceId!=="vampire"||!s.vampireChoice) return ""; const label=s.vampireChoice==="jeunesse"?"Fougue de la jeunesse (moins de 250 ans) : +10 en Combat":"Vampire vénérable (plus de 250 ans) : +10 en Savoir"; return `<p style="margin-top:.4rem"><b>Âge choisi :</b> ${esc(label)}</p>`; })()}
       ${(()=>{ const h=core.getHybridChoice(); if(!h) return ""; const parent=D.RACES.find(r=>r.id===s.hybridParentId); return `<p style="margin-top:.4rem"><b>Trait hybride hérité (${esc(parent?parent.name:"")}) :</b> ${esc(h.label)}</p>`; })()}
     </div>

     <div class="block"><h4>Traits naturels</h4><p>
       ${s.traitFree?`<span class="badge pos">${esc(s.traitFree.skill)} → ${esc(s.traitFree.label)} (+10)</span> `:""}
       ${(s.traitPairs||[]).map(p=>`<span class="badge pos">${esc(p.pos)} → ${esc(D.NATURAL_TRAITS[p.pos][0])} (+10)</span> <span class="badge neg">${esc(p.neg)} → ${esc(D.NATURAL_TRAITS[p.neg][1])} (-10)</span>`).join(" ")}
       ${(!s.traitFree && !(s.traitPairs||[]).length) ? "—":""}
     </p></div>

     <div class="two-col">
       <div class="block"><h4>Dons de classe</h4>
         ${cls?`<p><b>${esc(cls.name)}</b><br>Niv.1 : ${esc(cls.n1)}<br>${cls.n3?`Niv.3 : ${esc(cls.n3)}<br>`:""}${cls.n5?`Niv.5 : ${esc(cls.n5)}<br>`:""}Passif : ${esc(cls.passif)}</p>`:"<p>—</p>"}
         ${cls2?`<p><b>${esc(cls2.name)}</b> (secondaire)<br>${esc(cls2.n1)}</p>`:""}
         ${(()=>{ const a=core.getArcane(s.arcaneMain); return a?`<p><b>Arcane :</b> ${esc(a.name)} — ${esc(a.archetype)}<br>${esc(a.bonus)} ${esc(a.weakness)}</p>`:""; })()}
         ${(()=>{ const d=core.getDeity(s.deityId); return d?`<p><b>Divinité :</b> ${esc(d.name)} (${esc(d.domaine)})<br><i>Oraison :</i> ${esc(d.oraison)}</p>`:""; })()}
         ${(()=>{ const w=D.WEAPON_BRANCHES.find(x=>x.id===s.guerrierWeaponId); return w?`<p><b>Arme de prédilection :</b> ${esc(w.name)} (+10 maîtrise)</p>`:""; })()}
         ${s.rodeurMilieu?`<p><b>Milieu de prédilection :</b> ${esc(s.rodeurMilieu)} (Pister et Embuscade +20 dans ce milieu, à appliquer manuellement en jeu)</p>`:""}
       </div>
       <div class="block"><h4>Équipement</h4><p>${s.equipmentText?esc(s.equipmentText).replace(/\\n/g,"<br>"):"—"}</p></div>
     </div>

     <div class="block"><h4>Compétences civiles</h4><div class="two-col" style="grid-template-columns:repeat(3,1fr)">${civilBlocks}</div></div>

     ${masteriesBlock}

     <div class="block"><h4>Arbre de combat</h4><p class="help" style="margin:-.2rem 0 .6rem;color:var(--ink-soft)">${weaponArbreRecap}</p><table class="simple"><tbody>${weaponBlocks||"<tr><td>Aucune branche débloquée.</td></tr>"}</tbody></table></div>

     <div class="block"><h4>Arbre de magie</h4><p class="help" style="margin:-.2rem 0 .6rem;color:var(--ink-soft)">${magicArbreRecap}</p><table class="simple"><tbody>${magicBlocks||"<tr><td>Aucune sous-école débloquée.</td></tr>"}</tbody></table></div>

     <div class="block"><h4>Mémos — règles à garder en tête</h4>
       <div class="memo-grid">
         ${D.RULE_MEMOS.map(m=>`<div class="memo-item"><b>${esc(m.title)}</b>${esc(m.text)}<span class="src">${esc(m.chapter)}</span></div>`).join("")}
       </div>
     </div>
    `;
    $("#trk-level").addEventListener("change", e=>{ let v=parseInt(e.target.value,10); if(isNaN(v)||v<1) v=1; s.level=v; core.saveState(); paintSheet(); });
    $("#trk-xp").addEventListener("change", e=>{ let v=parseInt(e.target.value,10); if(isNaN(v)||v<0) v=0; s.xp=v; core.saveState(); });
    $("#trk-pv").addEventListener("change", e=>{ const v=e.target.value===""?null:parseInt(e.target.value,10); s.curPV=(v==null||isNaN(v))?null:v; core.saveState(); });
    $("#trk-gold").addEventListener("change", e=>{ const v=e.target.value===""?null:parseInt(e.target.value,10); s.curGold=(v==null||isNaN(v))?null:v; core.saveState(); });
    $("#levelUpBtn").addEventListener("click", ()=> openLevelUpWizard(paintSheet));
  }
}

/* ---------- Assistant de passage de niveau (Chapitre X, p.82) ----------
   Applique : +PV (mod. Constitution, +1 PV fixe si le modificateur est nul), +1 caractéristique au
   choix tous les 5 niveaux, dé de magie qui évolue tous les 3 niveaux (automatique, déjà géré par
   magicDieForLevel), et de nouveaux points de compétences civiles / de maîtrise combat & magie.
   Ces points s'ajoutent aux réserves existantes ; le joueur les dépense ensuite via les étapes
   III, V et VI, où un bouton permet aussi d'échanger 5 points de maîtrise inutilisés contre 1 point
   d'arbre supplémentaire. */
function closeLevelUpModal(){ const b=document.querySelector(".modal-backdrop.lvlup"); if(b) b.remove(); }
function openLevelUpWizard(onDone){
  closeLevelUpModal();
  const s = core.state;
  s.levelStatBonus = s.levelStatBonus || {FOR:0,CON:0,INT:0,DEX:0,CHA:0,CHANCE:0};
  s.levelCivilBonus = s.levelCivilBonus || {Savoir:0,Communication:0,Physique:0,Manipulation:0,Discretion:0,Perception:0};
  const curLevel = s.level||1, nextLevel = curLevel+1;
  const conMod = core.statModFinal("CON") ?? 0;
  // "il ajoute son modificateur de Constitution aux PV. Si celui-ci est nul, il rajoute 1 PV" (p.82) —
  // le texte ne précise pas le cas d'un modificateur négatif : on applique alors ce modificateur tel quel.
  const pvGain = conMod===0 ? 1 : conMod;
  const canPickStat = (nextLevel % 5 === 0);
  const magicStepUp = (nextLevel % 3 === 0);
  // Trait racial Humain "Compétent : +1 point d'arbre tous les trois niveaux" (p.12). Le livre ne
  // précise pas d'ancrage explicite ; par cohérence avec les autres mécaniques à cadence de ce même
  // livre qui déclenchent PILE sur les multiples (dé de magie à 3/6/9, caractéristique à 5/10/15,
  // Drakéide "tranche de 5 niveaux"), ce bonus se déclenche aux niveaux 3, 6, 9... et non dès la
  // création (niveau 1).
  // Azates : "Hybride divin ; choisi un trait d'humain..." (Chapitre I) — Humain n'ayant qu'un seul
  // trait racial listé (Compétent), ce n'est pas un choix réel : l'Azates l'obtient donc aussi.
  // Semi-nain/Semi-elfe/Semi-orc : ne l'obtiennent que s'ils ont choisi "Compétent" comme trait
  // "Hybride" hérité du parent Humain (cf. getHybridChoice()).
  const hybridChoice = core.getHybridChoice ? core.getHybridChoice() : null;
  const hasCompetent = core.state.raceId === "humain" || core.state.raceId === "azates" || (hybridChoice && hybridChoice.special==="competent");
  const competentTrigger = hasCompetent && (nextLevel % 3 === 0);

  function computeGains(){
    // Chapitre X p.82 : chacun de ces trois calculs multiplie le modificateur concerné par 5
    // (minimum 1 si le modificateur est inférieur à 1).
    const civilGains = {};
    Object.keys(D.SKILL_CATEGORIES).forEach(cat=>{ civilGains[cat] = Math.max(1, core.statModFinal(D.CATEGORY_STAT[cat]) ?? 0) * 5; });
    const bestMartial = Math.max(core.statModFinal("FOR") ?? 0, core.statModFinal("DEX") ?? 0);
    const weaponGain = Math.max(1, bestMartial) * 5;
    const magicGain = Math.max(1, core.statModFinal("INT") ?? 0) * 5;
    return {civilGains, weaponGain, magicGain};
  }

  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop lvlup no-print";
  backdrop.innerHTML = `<div class="modal-card">
    <button type="button" class="btn ghost small modal-close" id="lvlClose">✕ Fermer</button>
    <h3>Passage de niveau — ${curLevel} → ${nextLevel}</h3>
    <p class="help">Chapitre X, p.82. Voici ce que ${esc(s.identity.name||"ce personnage")} gagne à ce niveau.</p>
    <div class="block" style="margin-bottom:.8rem"><b>Points de vie</b> : +${pvGain} PV${conMod===0?" (modificateur de Constitution nul → +1 PV fixe)":" (modificateur de Constitution)"}.</div>
    ${canPickStat?`<div class="field"><label>Niveau multiple de 5 : choisis une caractéristique à augmenter de +1</label>
      <select id="lvlStatPick">${D.STATS.map(st=>`<option value="${st}">${D.STAT_LABELS[st]} (actuel : ${core.statFinal(st)})</option>`).join("")}</select></div>`:""}
    ${magicStepUp?`<div class="block">Niveau multiple de 3 : le dé de magie passe automatiquement à <b>${esc(core.magicDieForLevel(nextLevel))}</b> (Chapitre VI, p.42).</div>`:""}
    ${competentTrigger?`<div class="field"><label>Trait racial « Compétent » (Humain) : +1 point d'arbre bonus tous les 3 niveaux — dans quel arbre ?</label>
      <select id="lvlCompetentPick"><option value="weapon">Arbre de combat</option><option value="magic">Arbre de magie</option></select></div>`:""}
    <div id="lvlGainsRecap"></div>
    <p class="help">Ces points s'ajoutent à tes réserves existantes — rends-toi ensuite aux étapes III, V et VI pour les dépenser (un bouton y permet aussi d'échanger 5 points de maîtrise inutilisés contre 1 point d'arbre).</p>
    <div style="display:flex;gap:.6rem;margin-top:1rem">
      <button type="button" class="btn" id="lvlConfirm">Valider le passage de niveau</button>
      <button type="button" class="btn secondary" id="lvlCancel">Annuler</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click", e=>{ if(e.target===backdrop) closeLevelUpModal(); });
  $("#lvlClose").addEventListener("click", closeLevelUpModal);
  $("#lvlCancel").addEventListener("click", closeLevelUpModal);

  function paintGains(){
    const g = computeGains();
    $("#lvlGainsRecap").innerHTML = `
      <div class="block"><b>Points de compétences civiles gagnés</b> <small class="help">(modificateur associé × 5, minimum 1)</small>
        <table class="simple"><tbody>
          ${Object.keys(g.civilGains).map(cat=>`<tr><td>${esc(cat)} <small class="help">(${D.STAT_LABELS[D.CATEGORY_STAT[cat]]})</small></td><td class="tabular" style="text-align:right">+${g.civilGains[cat]}</td></tr>`).join("")}
        </tbody></table>
      </div>
      <div class="block">Points de maîtrise de combat : <b>+${g.weaponGain}</b> <small class="help">(meilleur des modificateurs Force/Dextérité × 5, minimum 1)</small></div>
      <div class="block">Points de maîtrise de magie : <b>+${g.magicGain}</b> <small class="help">(modificateur d'Intelligence × 5, minimum 1)</small></div>
      ${competentTrigger?`<div class="block">Trait « Compétent » : <b>+1 point d'arbre</b> bonus (à placer selon le choix ci-dessus).</div>`:""}`;
  }
  paintGains();
  const statSel = $("#lvlStatPick"); if(statSel) statSel.addEventListener("change", paintGains);

  $("#lvlConfirm").addEventListener("click", ()=>{
    const priorCurPV = core.currentPV();
    const g = computeGains();
    if(canPickStat){ const picked = $("#lvlStatPick").value; s.levelStatBonus[picked] = (s.levelStatBonus[picked]||0)+1; }
    if(competentTrigger){
      const treePick = $("#lvlCompetentPick").value;
      if(treePick==="magic") s.magicArbreBonus = (s.magicArbreBonus||0)+1;
      else s.weaponArbreBonus = (s.weaponArbreBonus||0)+1;
    }
    s.level = nextLevel;
    s.curPV = (priorCurPV==null? core.pvValue() : priorCurPV) + pvGain;
    Object.keys(g.civilGains).forEach(cat=>{ s.levelCivilBonus[cat] = (s.levelCivilBonus[cat]||0) + g.civilGains[cat]; });
    s.levelWeaponMasteryBonus = (s.levelWeaponMasteryBonus||0) + g.weaponGain;
    s.levelMagicMasteryBonus = (s.levelMagicMasteryBonus||0) + g.magicGain;
    // XP : on décompte le seuil du niveau franchi, sans bloquer si le total est insuffisant (certains MJ
    // accordent des niveaux "à la main", hors calcul strict de l'expérience).
    const threshold = core.XP_THRESHOLDS[curLevel];
    if(threshold!=null) s.xp = Math.max(0, (s.xp||0) - threshold);
    core.saveState();
    closeLevelUpModal();
    core.renderSummary();
    if(onDone) onDone();
  });
}

window.ADA.core.renderStep2=renderStep2; window.ADA.core.renderStep3=renderStep3; window.ADA.core.renderStep4=renderStep4;
window.ADA.core.renderStep5=renderStep5; window.ADA.core.renderStep6=renderStep6; window.ADA.core.renderStep7=renderStep7;
window.ADA.core.renderStep8=renderStep8;
})();
</script>
<script>
/* =====================================================================
   COMPTE & SAUVEGARDE CLOUD (Supabase) — entièrement facultatif.
   Renseigne les deux constantes ci-dessous (URL du projet + clé publique "anon") après avoir suivi
   le guide de configuration fourni à côté de ce fichier. Tant qu'elles sont vides — ou si la librairie
   Supabase ne charge pas (pas de réseau, hébergement qui bloque les scripts externes...) — l'outil
   fonctionne exactement comme avant : sauvegarde locale uniquement, aucune barre de compte affichée.
   ===================================================================== */
(function(){
"use strict";
const SUPA_URL = "https://hqdmhbxrejocscvpqdgk.supabase.co";
const SUPA_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxZG1oYnhyZWpvY3NjdnBxZGdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzczMDYsImV4cCI6MjEwMzE1MzMwNn0.zobPwDqDHsJgccjZedUHq6Q3Sj-0gZfNySjmS5XaMx4";  // clé publique "anon" (ce n'est PAS un secret, elle est faite pour être ici)

const core = window.ADA.core, D=core.D, $=core.$, $$=core.$$, esc=core.esc;
const LS_CHAR_ID = "ada_current_char_id";

let sb = null;
try{
  if(SUPA_URL && SUPA_ANON_KEY && window.supabase && typeof window.supabase.createClient==="function"){
    sb = window.supabase.createClient(SUPA_URL, SUPA_ANON_KEY);
  }
}catch(e){ sb = null; }

function cloudEnabled(){ return !!sb; }
let authSession = null;
let syncTimer = null;
let syncStatusText = "";

/* ---------- sync vers le cloud (débouncé, déclenché après chaque saveState()) ---------- */
function scheduleCloudSync(){
  if(!cloudEnabled() || !authSession) return;
  const charId = localStorage.getItem(LS_CHAR_ID);
  if(!charId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>pushToCloud(charId), 1200);
}
function pushToCloud(charId){
  if(!sb || !authSession) return;
  const name = (core.state.identity && core.state.identity.name) || "Sans nom";
  sb.from("characters").update({name, data: core.state}).eq("id", charId).then(({error})=>{
    syncStatusText = error ? "Erreur de sauvegarde cloud — la sauvegarde locale reste à jour." : ("Sauvegardé en ligne · " + new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}));
    updateSyncStatusEl();
  }).catch(()=>{ syncStatusText = "Erreur de sauvegarde cloud — la sauvegarde locale reste à jour."; updateSyncStatusEl(); });
}
function updateSyncStatusEl(){ const el=document.getElementById("syncStatus"); if(el) el.textContent = syncStatusText; }
window.ADA._saveHooks.push(scheduleCloudSync);

/* ---------- barre de compte ---------- */
function renderAuthBar(){
  const bar = document.getElementById("authBar");
  if(!bar) return;
  if(!cloudEnabled()){ bar.innerHTML=""; return; }
  if(!authSession){
    bar.innerHTML = `<span class="authmsg">Sauvegarde en ligne disponible pour retrouver ta fiche plus tard.</span>
      <button type="button" class="btn secondary small" id="authShowSignin">Se connecter</button>
      <button type="button" class="btn small" id="authShowSignup">Créer un compte</button>`;
    $("#authShowSignin").addEventListener("click", ()=>renderAuthForm("signin"));
    $("#authShowSignup").addEventListener("click", ()=>renderAuthForm("signup"));
  } else {
    const linked = !!localStorage.getItem(LS_CHAR_ID);
    bar.innerHTML = `<span class="authmsg">Connecté : ${esc(authSession.user.email)}${linked?"":" — aucun personnage sauvegardé ouvert"}</span>
      <span id="syncStatus" class="authmsg" style="margin-right:0"></span>
      <button type="button" class="btn secondary small" id="authMyChars">Mes personnages</button>
      <button type="button" class="btn ghost small" id="authSignOut">Se déconnecter</button>`;
    updateSyncStatusEl();
    $("#authMyChars").addEventListener("click", openCharPicker);
    $("#authSignOut").addEventListener("click", async ()=>{
      const wasLinked = !!localStorage.getItem(LS_CHAR_ID);
      try{ await sb.auth.signOut(); }catch(e){}
      authSession = null;
      if(wasLinked){
        // Si un personnage sauvegardé était ouvert, on efface la copie de travail locale en se déconnectant :
        // sur un appareil partagé entre joueurs, la personne suivante ne doit pas voir/récupérer ce personnage.
        try{ localStorage.removeItem("ada_char_v1"); localStorage.removeItem(LS_CHAR_ID); }catch(e){}
        location.reload();
      } else {
        renderAuthBar();
      }
    });
  }
}

function renderAuthForm(mode){
  const bar = document.getElementById("authBar");
  const isSignup = mode==="signup";
  bar.innerHTML = `<form id="authForm" class="no-print">
      <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required>
      <input type="password" id="authPw" placeholder="Mot de passe" autocomplete="${isSignup?"new-password":"current-password"}" minlength="6" required>
      <button type="submit" class="btn small">${isSignup?"Créer le compte":"Se connecter"}</button>
      <button type="button" class="btn ghost small" id="authCancel">Annuler</button>
      <span id="authMsg"></span>
    </form>`;
  $("#authCancel").addEventListener("click", renderAuthBar);
  $("#authForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const email = $("#authEmail").value.trim(), pw = $("#authPw").value;
    const msgEl = $("#authMsg");
    msgEl.className=""; msgEl.textContent="Un instant…";
    try{
      if(isSignup){
        const {data, error} = await sb.auth.signUp({email, password:pw});
        if(error){ msgEl.className="authErr"; msgEl.textContent=fmtAuthError(error); return; }
        if(data.session){ authSession=data.session; renderAuthBar(); openCharPicker(); }
        else { msgEl.className="authOk"; msgEl.textContent="Compte créé ! Vérifie tes emails pour confirmer ton adresse, puis connecte-toi."; }
      } else {
        const {data, error} = await sb.auth.signInWithPassword({email, password:pw});
        if(error){ msgEl.className="authErr"; msgEl.textContent=fmtAuthError(error); return; }
        authSession = data.session; renderAuthBar();
        if(!localStorage.getItem(LS_CHAR_ID)) openCharPicker();
      }
    }catch(err){ msgEl.className="authErr"; msgEl.textContent="Connexion au serveur impossible. Vérifie ta connexion internet."; }
  });
}
function fmtAuthError(error){
  const m = (error && error.message) || "";
  if(/already registered|already exists/i.test(m)) return "Un compte existe déjà avec cet email.";
  if(/invalid login credentials/i.test(m)) return "Email ou mot de passe incorrect.";
  if(/password/i.test(m) && /6/.test(m)) return "Le mot de passe doit faire au moins 6 caractères.";
  return m || "Une erreur est survenue.";
}

/* ---------- sélecteur de personnages ---------- */
function closeModal(){ const b=document.querySelector(".modal-backdrop"); if(b) b.remove(); }
async function openCharPicker(){
  closeModal();
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop no-print";
  backdrop.innerHTML = `<div class="modal-card">
    <button type="button" class="btn ghost small modal-close" id="charClose">✕ Fermer</button>
    <h3>Mes personnages</h3>
    <p class="help" id="charListStatus">Chargement…</p>
    <div class="charlist" id="charListRoot"></div>
    <form id="newCharForm" style="display:flex;gap:.5rem;margin-top:.6rem">
      <input type="text" id="newCharName" placeholder="Nom du nouveau personnage" style="flex:1">
      <button type="submit" class="btn small">+ Nouveau personnage</button>
    </form>
    <div id="importRow" style="margin-top:.8rem"></div>
  </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click", e=>{ if(e.target===backdrop) closeModal(); });
  $("#charClose").addEventListener("click", closeModal);
  $("#newCharForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const name = $("#newCharName").value.trim() || "Sans nom";
    await createCharacter(name);
  });

  // proposer d'importer la fiche locale en cours si elle n'est pas déjà liée à un personnage sauvegardé
  if(!localStorage.getItem(LS_CHAR_ID) && core.state.identity && core.state.identity.name){
    const row = document.createElement("div");
    row.innerHTML = `<button type="button" class="btn secondary small" id="importLocalBtn">Importer la fiche en cours (« ${esc(core.state.identity.name)} ») dans mon compte</button>`;
    document.getElementById("importRow").appendChild(row);
    document.getElementById("importLocalBtn").addEventListener("click", importLocalAsNewCharacter);
  }

  const {data, error} = await sb.from("characters").select("id,name,updated_at").order("updated_at",{ascending:false});
  const statusEl = document.getElementById("charListStatus");
  if(!statusEl) return; // modale déjà refermée entre-temps
  if(error){ statusEl.textContent = "Impossible de charger tes personnages pour le moment."; return; }
  if(!data || !data.length){ statusEl.textContent = "Aucun personnage sauvegardé pour l'instant."; return; }
  statusEl.textContent = "";
  const listRoot = document.getElementById("charListRoot");
  listRoot.innerHTML = data.map(c=>`<div class="charrow" data-id="${esc(c.id)}">
      <span class="cname">${esc(c.name||"Sans nom")}</span>
      <span class="cdate">${esc(new Date(c.updated_at).toLocaleDateString("fr-FR"))}</span>
      <span class="cactions">
        <button type="button" class="btn small" data-open="${esc(c.id)}">Ouvrir</button>
        <button type="button" class="btn ghost small" data-del="${esc(c.id)}" title="Supprimer">✕</button>
      </span>
    </div>`).join("");
  $$("#charListRoot [data-open]").forEach(b=> b.addEventListener("click", ()=>openCharacter(b.dataset.open)));
  $$("#charListRoot [data-del]").forEach(b=> b.addEventListener("click", ()=>deleteCharacterConfirm(b.dataset.del, b.closest(".charrow").querySelector(".cname").textContent)));
}

async function createCharacter(name){
  if(!authSession) return;
  const data = core.freshState();
  data.identity.name = name;
  const {data:row, error} = await sb.from("characters").insert({user_id: authSession.user.id, name, data}).select("id").single();
  if(error){ alert("Impossible de créer le personnage : "+(error.message||"erreur inconnue")); return; }
  localStorage.setItem("ada_char_v1", JSON.stringify(data));
  localStorage.setItem(LS_CHAR_ID, row.id);
  location.reload();
}
async function openCharacter(id){
  const {data:row, error} = await sb.from("characters").select("data").eq("id", id).single();
  if(error || !row){ alert("Impossible d'ouvrir ce personnage."); return; }
  localStorage.setItem("ada_char_v1", JSON.stringify(row.data));
  localStorage.setItem(LS_CHAR_ID, id);
  location.reload();
}
async function importLocalAsNewCharacter(){
  if(!authSession) return;
  const name = (core.state.identity && core.state.identity.name) || "Sans nom";
  const {data:row, error} = await sb.from("characters").insert({user_id: authSession.user.id, name, data: core.state}).select("id").single();
  if(error){ alert("Impossible d'importer la fiche : "+(error.message||"erreur inconnue")); return; }
  localStorage.setItem(LS_CHAR_ID, row.id);
  location.reload();
}
function deleteCharacterConfirm(id, name){
  if(!confirm("Supprimer définitivement « "+name+" » ? Cette action est irréversible.")) return;
  sb.from("characters").delete().eq("id", id).then(({error})=>{
    if(error){ alert("Impossible de supprimer ce personnage."); return; }
    if(localStorage.getItem(LS_CHAR_ID)===id) localStorage.removeItem(LS_CHAR_ID);
    openCharPicker(); // rafraîchit la liste
  });
}

window.ADA.__cloud = {cloudEnabled}; // exposé pour d'éventuels tests / diagnostics

/* ---------- démarrage ---------- */
if(cloudEnabled()){
  sb.auth.getSession().then(({data})=>{ authSession = data.session; renderAuthBar(); }).catch(()=>{ renderAuthBar(); });
  sb.auth.onAuthStateChange((_event, session)=>{ authSession = session; renderAuthBar(); });
}
})();
</script>
<script>
/* =====================================================================
   INIT
   ===================================================================== */
(function(){
"use strict";
const core = window.ADA.core;
function renderAll(){
  core.renderRail();
  core.renderSummary();
  const root = document.getElementById("stepRoot");
  const renderers = [core.renderStep1,core.renderStep2,core.renderStep3,core.renderStep4,core.renderStep5,core.renderStep6,core.renderStep7,core.renderStep8];
  renderers[core.state.step](root);
}
window.ADA.renderAll = renderAll;

function applyTheme(t){
  if(t){ document.documentElement.setAttribute("data-theme", t); } else { document.documentElement.removeAttribute("data-theme"); }
  try{ localStorage.setItem("ada_theme", t||""); }catch(e){}
}
document.getElementById("themeToggle").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : (cur==="light" ? null : (window.matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));
  applyTheme(next);
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Recommencer une nouvelle fiche ? Toute la progression actuelle sera perdue (le personnage restera sauvegardé dans ton compte si tu en avais ouvert un — utilise « Mes personnages » pour le retrouver).")) return;
  try{ localStorage.removeItem("ada_char_v1"); localStorage.removeItem("ada_current_char_id"); }catch(e){}
  location.reload();
});

try{ const t=localStorage.getItem("ada_theme"); if(t) applyTheme(t); }catch(e){}
renderAll();
