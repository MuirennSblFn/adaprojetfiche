<title>Forge de Personnage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<!-- Sauvegarde en ligne (comptes joueurs) : bibliothèque Supabase, chargée depuis un CDN.
     Si SUPA_URL / SUPA_ANON_KEY (voir plus bas) ne sont pas renseignés, ou si ce script ne charge pas
     (pas de réseau, hébergement qui bloque les scripts externes...), l'outil continue de fonctionner
     normalement en local (comme avant) : la sauvegarde cloud est une amélioration facultative. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#efe4c9;
  --surface:#fbf4e2;
  --surface-2:#f2e6c8;
  --ink:#2b2013;
  --ink-soft:#5b4c38;
  --ink-faint:#8a7a5c;
  --accent:#8f251f;
  --accent-ink:#fff7e9;
  --gold:#8a6a1e;
  --gold-soft:#c9a94a;
  --good:#3e6b4f;
  --danger:#9c2b26;
  --border:#c9b78e;
  --border-soft:#ddd0aa;
  --shadow:0 12px 30px -14px rgba(43,32,19,.45);
  --radius:10px;
  --pentagram-opacity:.05;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161209;
    --surface:#201a10;
    --surface-2:#271f13;
    --ink:#ece0bf;
    --ink-soft:#c1ac7c;
    --ink-faint:#8d7a54;
    --accent:#e0665a;
    --accent-ink:#1c1108;
    --gold:#d7b445;
    --gold-soft:#c9a94a;
    --good:#7fb98f;
    --danger:#e0665a;
    --border:#4a3c22;
    --border-soft:#3a2f1c;
    --shadow:0 16px 34px -14px rgba(0,0,0,.6);
    --pentagram-opacity:.07;
  }
}
:root[data-theme="dark"]{
  --bg:#161209;
  --surface:#201a10;
  --surface-2:#271f13;
  --ink:#ece0bf;
  --ink-soft:#c1ac7c;
  --ink-faint:#8d7a54;
  --accent:#e0665a;
  --accent-ink:#1c1108;
  --gold:#d7b445;
  --gold-soft:#c9a94a;
  --good:#7fb98f;
  --danger:#e0665a;
  --border:#4a3c22;
  --border-soft:#3a2f1c;
  --shadow:0 16px 34px -14px rgba(0,0,0,.6);
  --pentagram-opacity:.07;
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light dark}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Spectral",Georgia,"Times New Roman",serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Cinzel",Georgia,serif;font-weight:600;letter-spacing:.02em;text-wrap:balance;margin:0 0 .4em}
.disp{font-family:"Cinzel Decorative","Cinzel",serif}
a{color:var(--accent)}
button{font-family:inherit}
input,select,textarea{font-family:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:.5em .6em;font-size:.95rem}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--gold-soft);color:#2b2013}
.tabular{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* faint pentagram watermark, drawn once with CSS conic/radial trick avoided -> use inline SVG bg */
.parchment-bg{
  background-image:
    radial-gradient(circle at 85% 10%, color-mix(in srgb, var(--accent) 18%, transparent) 0, transparent 45%),
    radial-gradient(circle at 8% 92%, color-mix(in srgb, var(--gold) 14%, transparent) 0, transparent 40%);
}

/* ============ SHELL LAYOUT ============ */
.app{min-height:100dvh;display:flex;flex-direction:column}
header.top{
  display:flex;align-items:center;gap:.9rem;padding:.85rem 1.4rem;
  border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:.7rem;flex:1;min-width:0}
.brand svg{flex:none}
.brand .names{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand .names b{font-family:"Cinzel",serif;font-size:1.05rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .names span{font-size:.72rem;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.top-actions{display:flex;gap:.5rem;align-items:center}
.icon-btn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  border-radius:8px;width:2.3rem;height:2.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:hover{border-color:var(--accent)}

/* ---- barre de compte / sauvegarde cloud ---- */
#authBar{display:flex;align-items:center;justify-content:flex-end;gap:.6rem;flex-wrap:wrap;padding:.5rem 1.4rem;border-bottom:1px solid var(--border-soft);background:var(--surface-2);font-size:.82rem}
#authBar:empty{display:none;padding:0;border-bottom:none}
#authBar .authmsg{color:var(--ink-soft);margin-right:auto}
#authBar form{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
#authBar input{padding:.4em .55em;font-size:.82rem;width:11rem}
#authBar .authErr{color:var(--danger);font-size:.76rem;flex-basis:100%}
#authBar .authOk{color:var(--good);font-size:.76rem;flex-basis:100%}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,14,4,.55);display:flex;align-items:center;justify-content:center;padding:1.5rem;z-index:100}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:1.5rem 1.6rem}
.modal-card h3{margin:0 0 .9rem}
.modal-card .modal-close{float:right}
.charlist{display:flex;flex-direction:column;gap:.6rem;margin:1rem 0}
.charrow{display:flex;align-items:center;gap:.8rem;border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;background:var(--surface-2)}
.charrow .cname{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.charrow .cdate{font-size:.72rem;color:var(--ink-faint)}
.charrow .cactions{display:flex;gap:.4rem;flex:none}

.layout{
  flex:1;display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:1.2rem;
  max-width:1400px;margin:0 auto;width:100%;padding:1.2rem 1.4rem 3rem;
}
@media (max-width:1100px){.layout{grid-template-columns:1fr;padding:1rem}}

/* ---- chapter rail ---- */
nav.rail{position:sticky;top:4.6rem;align-self:start;display:flex;flex-direction:column;gap:.35rem}
.rail button{
  display:flex;align-items:baseline;gap:.6rem;text-align:left;background:transparent;border:1px solid transparent;
  border-radius:8px;padding:.55rem .7rem;cursor:pointer;color:var(--ink-soft);
}
.rail button .num{font-family:"Cinzel",serif;font-size:.8rem;color:var(--gold);flex:none;width:1.6em}
.rail button .lbl{font-size:.86rem;line-height:1.2}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="step"]{background:var(--surface);border-color:var(--border);color:var(--ink);box-shadow:var(--shadow)}
.rail button[aria-current="step"] .num{color:var(--accent)}
.rail button.done .num::after{content:"✓";margin-left:.15em}
@media (max-width:1100px){
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:.4rem;padding-bottom:.3rem}
  .rail button{flex:none}
  .rail button .lbl{display:none}
}

/* ---- main card ---- */
main.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:1.8rem 2rem 2.2rem;position:relative;overflow:hidden;
}
main.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--pentagram-opacity);
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><polygon points="100,10 123,72 190,72 136,112 156,178 100,140 44,178 64,112 10,72 77,72" fill="none" stroke="black" stroke-width="4"/></svg>') no-repeat 102% -8%/280px;
}
.step-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--border-soft);padding-bottom:.7rem;margin-bottom:1.3rem}
.step-head .eyebrow{font-family:"Cinzel",serif;font-size:.72rem;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.step-head h2{font-size:1.5rem;margin:0}
.step-foot{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--border-soft)}

.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
.field label{font-size:.78rem;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase}
.field small.help{color:var(--ink-faint);font-size:.78rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1.2rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 1.2rem}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

button.btn{
  font-family:"Cinzel",serif;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;
  border-radius:8px;padding:.65rem 1.2rem;cursor:pointer;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);
}
button.btn.secondary{background:transparent;color:var(--ink);border-color:var(--border)}
button.btn.ghost{background:transparent;color:var(--ink-soft);border-color:transparent}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.small{padding:.35rem .7rem;font-size:.72rem}

.card-pick{
  border:1px solid var(--border);border-radius:8px;padding:.8rem .9rem;cursor:pointer;background:var(--surface-2);
  display:flex;flex-direction:column;gap:.25rem;transition:border-color .15s;
}
.card-pick:hover{border-color:var(--gold)}
.card-pick.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card-pick h4{margin:0;font-size:.95rem;font-family:"Cinzel",serif}
.card-pick p{margin:0;font-size:.82rem;color:var(--ink-soft)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem}

.badge{display:inline-flex;align-items:center;gap:.3em;font-size:.72rem;border-radius:99px;padding:.15em .65em;border:1px solid var(--border);color:var(--ink-soft);background:var(--surface-2)}
.badge.pos{color:var(--good);border-color:color-mix(in srgb, var(--good) 40%, var(--border))}
.badge.neg{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 40%, var(--border))}

table.simple{border-collapse:collapse;width:100%;font-size:.88rem}
table.simple th,table.simple td{border-bottom:1px solid var(--border-soft);padding:.35em .5em;text-align:left}
table.simple th{color:var(--ink-soft);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}

/* stat blocks */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.stat-card{border:1px solid var(--border);border-radius:8px;padding:.8rem;background:var(--surface-2);text-align:center}
.stat-card .lbl{font-family:"Cinzel",serif;font-size:.72rem;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase}
.stat-card .val{font-size:2.1rem;font-weight:600}
.stat-card .mod{font-size:.85rem;color:var(--gold)}
.stat-card .breakdown{font-size:.68rem;color:var(--ink-faint);margin-top:.2rem}
.trackcard{border:1px solid var(--border);border-radius:8px;padding:.9rem .8rem 1.1rem;background:var(--surface-2);text-align:center;min-height:5.6rem}
.trackcard .lbl{font-family:"Cinzel",serif;font-size:.72rem;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase}
.trackcard input{width:100%;margin-top:.35rem;font-size:1.7rem;font-weight:600;text-align:center;background:transparent;border:none;border-bottom:1px dashed var(--border);border-radius:0;padding:.25rem .2rem .45rem;color:var(--ink);font-family:inherit}
.trackcard input:focus{outline:none;border-bottom-color:var(--gold)}
.trackcard .sub{font-size:.68rem;color:var(--ink-faint);margin-top:.35rem}
@media print{ .trackcard input{border-bottom:1px solid #999} }

/* skill rows / point buy */
.skillcat{border:1px solid var(--border);border-radius:8px;margin-bottom:.9rem;overflow:hidden}
.skillcat > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:.7rem .9rem;background:var(--surface-2);font-family:"Cinzel",serif;font-size:.85rem;letter-spacing:.03em}
.skillcat > summary::-webkit-details-marker{display:none}
.skillcat > summary::after{content:"▸";margin-left:auto;padding-left:.6rem;color:var(--ink-faint)}
.skillcat[open] > summary::after{content:"▾"}
.skillrow{display:grid;grid-template-columns:1fr auto auto;gap:.6rem;align-items:center;padding:.5rem .9rem;border-top:1px solid var(--border-soft)}
.skillrow .name{font-size:.88rem}
.skillrow input[type=number]{width:4.4rem;text-align:right}
.skillrow .bonus{font-size:.7rem;color:var(--gold);min-width:3.4rem;text-align:right}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.stepper button{width:1.8rem;height:1.8rem;border:none;background:var(--surface-2);cursor:pointer;color:var(--ink);font-size:1rem;line-height:1}
.stepper button:hover{background:var(--border-soft)}
.stepper input{width:3.2rem;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);text-align:center;border-radius:0;padding:.2rem}

/* budget banner */
.budget{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem .9rem;margin-bottom:1.1rem;font-size:.85rem}
.budget b{font-variant-numeric:tabular-nums}
.budget .ok{color:var(--good)}
.budget .over{color:var(--danger)}

/* tree branches */
.branch{border:1px solid var(--border);border-radius:8px;margin-bottom:.8rem;background:var(--surface-2)}
.branch > .bhead{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;flex-wrap:wrap}
.branch h4{margin:0;font-family:"Cinzel",serif;font-size:.92rem;flex:1}
.branch .mastery{font-variant-numeric:tabular-nums;font-size:1.05rem;color:var(--accent)}
.branch .nodes{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 .9rem .8rem}
.node{border:1px solid var(--border);border-radius:6px;padding:.3rem .55rem;font-size:.72rem;color:var(--ink-faint);background:var(--surface);cursor:pointer;white-space:nowrap}
.node.bought{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.node.locked{opacity:.4;cursor:not-allowed}
.branch .special{margin:0 .9rem .8rem;font-size:.78rem;color:var(--ink-soft);border-top:1px dashed var(--border-soft);padding-top:.5rem}
.branch .special b{color:var(--gold)}
.branch .unlock{margin:.9rem}

/* summary side rail */
aside.summary{position:sticky;top:4.6rem;align-self:start;display:flex;flex-direction:column;gap:.8rem}
.sumcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem 1.1rem}
.sumcard h3{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.6rem}
.sumcard .name{font-family:"Cinzel Decorative",serif;font-size:1.25rem;margin-bottom:.1rem}
.sumcard .sub{font-size:.8rem;color:var(--ink-soft);margin-bottom:.6rem}
.pillrow{display:flex;flex-wrap:wrap;gap:.3rem}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.6rem}
.mini-stats div{text-align:center;font-size:.72rem;color:var(--ink-soft)}
.mini-stats div b{display:block;font-size:1.05rem;color:var(--ink)}
@media (max-width:1100px){aside.summary{position:static}}

.dice-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.diefaces{display:flex;gap:.3rem}
.dieface{width:2.1rem;height:2.1rem;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.9rem;background:var(--surface-2)}
.dieface.dropped{opacity:.35;text-decoration:line-through}
@keyframes rollpop{0%{transform:scale(1)}50%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1)}}
.rolling{animation:rollpop .35s ease}

.trait-list{display:flex;flex-wrap:wrap;gap:.5rem}
.trait-chip{border:1px solid var(--border);border-radius:99px;padding:.35em .8em;font-size:.8rem;cursor:pointer;background:var(--surface-2)}
.trait-chip.selected{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.trait-chip.negative.selected{background:var(--danger);border-color:var(--danger)}

.note{border-left:3px solid var(--gold);padding:.6rem .9rem;background:var(--surface-2);border-radius:0 6px 6px 0;font-size:.85rem;color:var(--ink-soft);margin:.8rem 0}

/* final sheet */
.sheet{display:grid;gap:1rem}
.sheet .block{border:1px solid var(--border);border-radius:8px;padding:1rem 1.1rem;background:var(--surface-2)}
.sheet .block h4{font-family:"Cinzel",serif;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:.6rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:640px){.two-col{grid-template-columns:1fr}}
.memo-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem .9rem}
@media(max-width:640px){.memo-grid{grid-template-columns:1fr}}
.memo-item{border-left:3px solid var(--gold);padding:.05rem .8rem;font-size:.78rem;color:var(--ink-soft);line-height:1.45}
.memo-item b{display:block;color:var(--ink);font-family:"Cinzel",serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.15rem}
.memo-item .src{display:block;font-size:.68rem;color:var(--ink-faint);margin-top:.15rem;font-style:italic}

footer.site{text-align:center;color:var(--ink-faint);font-size:.75rem;padding:1.4rem;}

/* ============ PRINT ============ */
@media print{
  header.top,nav.rail,aside.summary,.step-foot,.no-print,.budget,footer.site{display:none !important}
  body{background:#fff;color:#111}
  .layout{display:block;padding:0;max-width:none}
  main.card{box-shadow:none;border:none;padding:0}
  main.card::before{display:none}
  .sheet .block{break-inside:avoid;border-color:#999}
}
</style>

<div class="app parchment-bg">
  <header class="top">
    <div class="brand">

      <div class="names">

</div>

<script>
/* =====================================================================
   MOTEUR DE L'ASSISTANT DE CRÉATION
   ===================================================================== */
(function(){
"use strict";
const D = window.ADA.DATA;
const ALL_WEAPON_BRANCHES = D.WEAPON_BRANCHES.concat(D.ARMOR_BRANCHES);
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function freshState(){
  return {
    identity:{name:"",player:"",align:"",eyes:"",hair:"",height:"",desc:"",portrait:null},
    raceId:null, raceChoiceBonuses:[],
    classMainId:null, classSecondaryId:null,
    arcaneMain:null, deityId:null, guerrierWeaponId:null, vampireChoice:null, rodeurMilieu:null, semiElfeParentBonus:null,
    hybridParentId:null, hybridTraitIdx:null, // trait "Hybride" choisi chez l'un des parents (races métisses)
    rolls:[], rollUsed:[], statRollIndex:{FOR:null,CON:null,INT:null,DEX:null,CHA:null,CHANCE:null},
    civil:{}, // "Compétence": points
    masteries:{}, // "Compétence": ["texte de la maîtrise choisie", ...] (compétence à 100 → 80)
    traitFree:null, traitPairs:[], // [{pos:"Skill",neg:"Skill"}]
    weaponStatChoice:"FOR",
    weapon:{ branches:{} }, // id -> {unlocked,mastery,chances,de,crit}
    magicStatChoice:"INT",
    magic:{ schools:{} }, // subId -> {unlocked,mastery}
    socialClassId:"moyenne",
    languages:[],
    equipmentText:"", historyText:"",
    level:1, xp:0, curPV:null, curGold:null, // suivi en jeu (fiche finale) — curPV/curGold null = valeur de départ calculée
    // Bonus cumulés via l'assistant de passage de niveau (Chapitre X, p.82) — s'ajoutent aux valeurs
    // calculées à la création, sans jamais modifier les champs de création eux-mêmes.
    levelStatBonus:{FOR:0,CON:0,INT:0,DEX:0,CHA:0,CHANCE:0}, // +1 choisi tous les 5 niveaux
    levelCivilBonus:{Savoir:0,Communication:0,Physique:0,Manipulation:0,Discretion:0,Perception:0}, // pts de compétences civiles gagnés
    levelWeaponMasteryBonus:0, levelMagicMasteryBonus:0, // pts de maîtrise combat/magie gagnés
    weaponMasteryConverted:0, weaponArbreBonus:0, // conversion 5 pts maîtrise → 1 pt d'arbre (Chapitre VII p.4 / X p.82)
    magicMasteryConverted:0, magicArbreBonus:0,
    step:0,
  };
}
let state = loadState() || freshState();
function saveState(){
  try{ localStorage.setItem("ada_char_v1", JSON.stringify(state)); }catch(e){}
  try{ window.ADA._saveHooks.forEach(fn=>{ try{ fn(); }catch(e){} }); }catch(e){}
}
function loadState(){ try{ const s=localStorage.getItem("ada_char_v1"); return s?JSON.parse(s):null; }catch(e){ return null; } }

// Redimensionne l'image de portrait choisie (côté client, via canvas) avant de la stocker en data URL,
// pour rester léger dans le localStorage et dans la fiche exportée.
function resizePortraitFile(file, cb){
  if(!file || !file.type || file.type.indexOf("image/")!==0){ cb(null); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 480;
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; }
        else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      try{ cb(canvas.toDataURL("image/jpeg", 0.85)); }catch(err){ cb(null); }
    };
    img.onerror = () => cb(null);
    img.src = e.target.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}

/* ---------- helpers de calcul ---------- */
function mod(v){ return Math.floor((v-10)/2); }
function getRace(){ return D.RACES.find(r=>r.id===state.raceId); }
function getClass(id){ return D.CLASSES_BASE.concat(D.CLASSES_SPECIAL).find(c=>c.id===id); }
function getArcane(id){ return D.ARCANES.find(a=>a.id===id); }
function getDeity(id){ for(const cult of D.RELIGIONS){ const d=cult.deities.find(x=>x.id===id); if(d) return Object.assign({culture:cult.culture},d); } return null; }
function hasClass(id){ return state.classMainId===id || state.classSecondaryId===id; }
function statBase(stat){ const i=state.statRollIndex[stat]; return (i!=null && state.rolls[i]!=null) ? state.rolls[i] : null; }
function statFinal(stat){
  const base = statBase(stat);
  if(base==null) return null;
  let addTotal=0, multFactor=1;
  const race=getRace();
  if(race){ race.bonus.concat(race.malus).forEach(b=>{ if(b.stat!==stat) return;
    if(b.op==="mult") multFactor*=b.val; else if(b.op==="div") multFactor/=b.val; else addTotal+=b.val; }); }
  (state.raceChoiceBonuses||[]).forEach(s=>{ if(s===stat) addTotal+=1; });
  // Semi-elfe : "+1 au choix +1 du parent (CHA/FOR/INT)" (Chapitre I, p.10) — un second +1 distinct du
  // "+1 au choix" générique (raceChoiceBonuses), restreint à ces trois caractéristiques.
  if(race && race.id==="semi-elfe" && state.semiElfeParentBonus===stat) addTotal+=1;
  // Bonus de +1 gagnés lors de passages de niveau (Chapitre X p.82 : "un point à l'une des
  // caractéristiques" tous les 5 niveaux) — appliqués APRÈS le calcul racial, comme un +1 littéral.
  const lvlBonus = (state.levelStatBonus && state.levelStatBonus[stat]) || 0;
  return Math.round((base+addTotal)*multFactor) + lvlBonus;
}
function statModFinal(stat){ const v=statFinal(stat); return v==null?null:mod(v); }
function civilBudget(cat){ const v=statFinal(D.CATEGORY_STAT[cat]); if(v==null) return 0; return Math.max(0,v)*6 + ((state.levelCivilBonus && state.levelCivilBonus[cat])||0); }
function civilSpent(cat){ return D.SKILL_CATEGORIES[cat].reduce((s,sk)=> s+(state.civil[sk]||0),0); }
function weaponPoolBase(){ const m=statModFinal(state.weaponStatChoice); return m==null?0:Math.max(1,m); }
function weaponArbrePoints(){ return weaponPoolBase() + (state.weaponArbreBonus||0); }
function weaponMasteryPoints(){ return weaponPoolBase()*5 + (state.levelWeaponMasteryBonus||0); }
function magicPoolBase(){ const m=statModFinal(state.magicStatChoice); return m==null?0:Math.max(1,m); }
function magicArbrePoints(){ return magicPoolBase() + (state.magicArbreBonus||0); }
function magicMasteryPoints(){ return magicPoolBase()*5 + (state.levelMagicMasteryBonus||0); }

function weaponArbreSpent(){
  let n=0;
  Object.values(state.weapon.branches).forEach(b=>{ if(b.unlocked) n+=1; n += (b.chances||0)+(b.de||0)+(b.crit||0); });
  return n;
}
// Les points de maîtrise convertis en points d'arbre (voir weaponArbreBonus) comptent comme "dépensés"
// dans la réserve de maîtrise, pour ne pas pouvoir être réutilisés deux fois.
function weaponMasterySpent(){ return Object.values(state.weapon.branches).reduce((s,b)=> s+(b.mastery||0),0) + (state.weaponMasteryConverted||0); }
function magicArbreSpent(){
  let n=0;
  // 1 point d'arbre pour débloquer la branche + 1 point d'arbre par point de dégâts investi
  // (Chapitre VI, p.42 : "un magicien peut investir un point d'arbre : celui-ci lui confèrera un point de dégâts supplémentaire").
  Object.values(state.magic.schools).forEach(b=>{ if(b.unlocked) n+=1; n += (b.dmgPts||0); });
  return n;
}
function magicMasterySpent(){ return Object.values(state.magic.schools).reduce((s,b)=> s+(b.mastery||0),0) + (state.magicMasteryConverted||0); }

function pvValue(){ const f=statFinal("FOR"), c=statFinal("CON"); if(f==null||c==null) return null; return Math.round((f+c)/2); }
function goldStart(){ const sc=D.SOCIAL_CLASSES.find(s=>s.id===state.socialClassId); if(!sc) return 0; return Math.min(1000, Math.floor(sc.salary/2)); }
function languageCount(){ const m=statModFinal("INT"); if(m==null) return 1; return Math.max(0,m)+1; }
// Suivi en jeu (fiche finale) : PV/or "actuels" partent de la valeur de départ calculée, mais peuvent
// être mis à jour manuellement par le joueur au fil de la campagne (dégâts, dépenses...).
function currentPV(){ return state.curPV!=null ? state.curPV : pvValue(); }
function currentGold(){ return state.curGold!=null ? state.curGold : goldStart(); }
// Chapitre X : l'échelle d'expérience (niveau -> montant requis pour accéder au niveau supérieur).
const XP_THRESHOLDS = {1:100,2:200,3:300,4:400,5:500,6:600,7:700,8:800,9:900,10:1000};
function nextLevelXP(){ return XP_THRESHOLDS[state.level] || null; }

function traitBonuses(){ // renvoie map skill -> total bonus des traits naturels choisis
  const map={};
  if(state.traitFree){ map[state.traitFree.skill]=(map[state.traitFree.skill]||0)+10; }
  (state.traitPairs||[]).forEach(p=>{ map[p.pos]=(map[p.pos]||0)+10; map[p.neg]=(map[p.neg]||0)-10; });
  return map;
}
function racialSkillNote(){ return getRace() ? getRace().traits : []; }
// Résout le trait "Hybride" choisi (races métisses : Semi-nain, Semi-elfe, Semi-orc) : le joueur
// choisit d'abord l'ascendance du parent (pour le Semi-elfe, en plus le type d'elfe précis), puis un
// trait dans la liste "hybridTraits" de ce parent. Retourne l'objet trait, ou null si rien n'est choisi.
function getHybridChoice(){
  const race = getRace();
  if(!race || !race.hybridParents || !state.hybridParentId || state.hybridTraitIdx==null) return null;
  if(!race.hybridParents.includes(state.hybridParentId)) return null;
  const parent = D.RACES.find(r=>r.id===state.hybridParentId);
  if(!parent || !parent.hybridTraits) return null;
  return parent.hybridTraits[state.hybridTraitIdx] || null;
}

// Bonus fixes et inconditionnels issus des traits raciaux et des dons de classe (passif + niveau 1
// uniquement, puisque le personnage est créé au niveau 1). Les bonus conditionnels/contextuels du
// livre (ex. "en forêt", "avec les nains") restent affichés en texte dans les traits mais ne sont
// PAS ajoutés au score, pour ne pas fausser la valeur permanente de la compétence.
function fixedSkillSources(){
  const sources=[]; // {label, skill, amount}
  function addFrom(entity, label){
    if(!entity || !entity.skillBonuses) return;
    entity.skillBonuses.forEach(b=>{
      if(b.skill){ sources.push({label, skill:b.skill, amount:b.amount}); }
      else if(b.category){ (D.SKILL_CATEGORIES[b.category]||[]).forEach(sk=> sources.push({label, skill:sk, amount:b.amount})); }
    });
  }
  addFrom(getRace(), "race");
  addFrom(getClass(state.classMainId), "classe");
  addFrom(getClass(state.classSecondaryId), "classe 2nd");
  // Trait "Hybride" hérité d'un parent (Semi-nain/Semi-elfe/Semi-orc) : n'ajoute le bonus que si le
  // trait choisi en porte un (les traits purement narratifs comme "Vision nocturne" n'en ont pas).
  (()=>{
    const h = getHybridChoice();
    if(!h) return;
    if(h.skill) sources.push({label:"race (hérité du parent)", skill:h.skill, amount:h.amount});
    else if(h.category) (D.SKILL_CATEGORIES[h.category]||[]).forEach(sk=> sources.push({label:"race (hérité du parent)", skill:sk, amount:h.amount}));
  })();
  // Vampire : "Vampire vénérable" (>250 ans) donne +10 en Savoir (catégorie entière). L'autre choix,
  // "Fougue de la jeunesse", donne +10 en Combat — hors compétences civiles, géré dans l'arbre de combat.
  if(state.raceId==="vampire" && state.vampireChoice==="venerable"){
    (D.SKILL_CATEGORIES["Savoir"]||[]).forEach(sk=> sources.push({label:"race (Vampire vénérable)", skill:sk, amount:10}));
  }
  return sources;
}
function fixedSkillBonuses(){
  const map={};
  fixedSkillSources().forEach(s=>{ map[s.skill]=(map[s.skill]||0)+s.amount; });
  return map;
}
// Combine bonus fixes (race/classe) + traits naturels choisis -> total par compétence, avec détail des sources.
function allSkillBonuses(){
  const map={}; // skill -> {total, parts:[{label,amount}]}
  function add(skill,amount,label){
    if(!map[skill]) map[skill]={total:0, parts:[]};
    map[skill].total += amount; map[skill].parts.push({label,amount});
  }
  fixedSkillSources().forEach(s=> add(s.skill, s.amount, s.label));
  if(state.traitFree) add(state.traitFree.skill, 10, "trait");
  (state.traitPairs||[]).forEach(p=>{ add(p.pos, 10, "trait"); add(p.neg, -10, "trait"); });
  return map;
}

// Fait progresser un dé de dégâts le long de la frise du livre (p.56) d'un nombre de crans donné
// (chaque nœud "+1 dé" fait monter le dé d'un cran, cumulable 3 fois).
function dieAtRank(baseDie, steps){
  const idx = D.DIE_RANKS.indexOf(baseDie);
  if(idx===-1) return baseDie; // dé personnalisé non reconnu : on le laisse tel quel
  return D.DIE_RANKS[Math.min(D.DIE_RANKS.length-1, idx+(steps||0))];
}
// Dé de magie selon le niveau du lanceur (Chapitre VI, p.42) : 1d6 (niv.1), 1d8 (niv.3), 1d10 (niv.6),
// 1d12 (niv.9), 1d20 (niv.12), 1d20+1d6 (niv.15), 1d20+1d8 (niv.18).
function magicDieForLevel(level){
  let d = D.MAGIC_LEVEL_DICE[0][1];
  D.MAGIC_LEVEL_DICE.forEach(([lvl,die])=>{ if((level||1)>=lvl) d=die; });
  return d;
}

/* ---------- dés ---------- */
function d6(){ return 1+Math.floor(Math.random()*6); }
function roll4d6drop(){ const r=[d6(),d6(),d6(),d6()]; const sorted=[...r].sort((a,b)=>a-b); const dropped=sorted[0];
  const kept=[...r]; const di=kept.indexOf(dropped); kept.splice(di,1);
  return {all:r, dropIndex:di, total:kept.reduce((a,b)=>a+b,0)}; }

/* ---------- steps ---------- */
const STEPS = [
 {id:"identite", num:"I", label:"Identité, race & classe"},
 {id:"carac", num:"II", label:"Caractéristiques"},
 {id:"competences", num:"III", label:"Compétences civiles"},
 {id:"traits", num:"IV", label:"Traits naturels"},
 {id:"combat", num:"V", label:"Arbre de combat"},
 {id:"magie", num:"VI", label:"Arbre de magie"},
 {id:"vie", num:"VII", label:"Points de vie & or"},
 {id:"fiche", num:"VIII", label:"Équipement & fiche finale"},
];

function go(i){ state.step=Math.max(0,Math.min(STEPS.length-1,i)); saveState(); window.ADA.renderAll(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- rendu : rail ---------- */
function renderRail(){
  const rail=$("#rail");
  rail.innerHTML = STEPS.map((s,i)=>{
    const done = i<state.step;
    return `<button data-i="${i}" class="${done?'done':''}" ${i===state.step?'aria-current="step"':''}>
      <span class="num">${s.num}</span><span class="lbl">${esc(s.label)}</span>
    </button>`;
  }).join("");
  $$("#rail button").forEach(b=> b.addEventListener("click", ()=> go(parseInt(b.dataset.i,10))));
}

/* ---------- rendu : résumé latéral ---------- */
function renderSummary(){
  const root=$("#summaryRoot");
  const race=getRace(), cls=getClass(state.classMainId), cls2=getClass(state.classSecondaryId);
  const pv=pvValue(), gold=goldStart();
  root.innerHTML = `
   <div class="sumcard">
     <div style="display:flex;align-items:center;gap:.7rem">
       ${state.identity.portrait?`<img src="${state.identity.portrait}" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex:0 0 auto">`:""}
       <div>
         <div class="name">${esc(state.identity.name||"Sans nom")}</div>
         <div class="sub">${race?esc(race.name):"Race non choisie"} ${cls?" · "+esc(cls.name):""}${cls2?" / "+esc(cls2.name):""}</div>
       </div>
     </div>
     <div class="pillrow">
       ${state.identity.align?`<span class="badge">${esc(state.identity.align)}</span>`:""}
       ${pv!=null?`<span class="badge pos">PV ${pv}</span>`:""}
       <span class="badge">Or ${gold} PO</span>
     </div>
     <div class="mini-stats">
      ${D.STATS.map(s=>{const v=statFinal(s); return `<div><b>${v==null?"–":v}</b>${s}</div>`;}).join("")}
     </div>
   </div>
   <div class="sumcard">
     <h3>Progression</h3>
     <div class="pillrow">
       ${STEPS.map((s,i)=>`<span class="badge ${i<state.step?'pos':''}">${s.num}</span>`).join("")}
     </div>
   </div>
   <div class="sumcard no-print">
     <h3>Export</h3>
     <p style="font-size:.82rem;color:var(--ink-soft);margin:0 0 .6rem">Va à l'étape VIII pour imprimer / exporter la fiche en PDF.</p>

}

/* ---------- STEP 1 : identité, race, classe ---------- */
function renderStep1(root){

  root.innerHTML = `

   <h3 style="margin-top:1.4rem">Race</h3>

        <p style="margin-top:.3rem"><small class="help">${r.bonus.map(b=>fmtBonus(b)).join(", ")||"—"} ${r.malus.length?(" / "+r.malus.map(b=>fmtBonus(b)).join(", ")):""}${r.choice?`, +1 au choix x${r.choice}`:""}</small></p>
      </div>`).join("")}
   </div>
   ${race? renderRaceDetail(race) : ""}

   ${state.raceId==="vampire"?`

   <div class="field"><label>Choix</label>
     <select id="f-vampirechoice"><option value="">— choisir —</option>
       <option value="jeunesse" ${state.vampireChoice==="jeunesse"?"selected":""}>Fougue de la jeunesse (moins de 250 ans) : +10 en Combat</option>
       <option value="venerable" ${state.vampireChoice==="venerable"?"selected":""}>Vampire vénérable (plus de 250 ans) : +10 en Savoir</option>
     </select></div>`:""}

   ${state.raceId==="semi-elfe"?`
   <h3 style="margin-top:1.6rem">+1 du parent elfe <small class="help">(en plus du +1 au choix général — Chapitre I, p.10)</small></h3>
   <div class="field"><label>Caractéristique</label>
     <select id="f-semielfebonus"><option value="">— choisir —</option>
       ${["CHA","FOR","INT"].map(st=>`<option value="${st}" ${state.semiElfeParentBonus===st?"selected":""}>${D.STAT_LABELS[st]}</option>`).join("")}
     </select></div>`:""}

   ${race && race.hybridParents?(()=>{
     const parent = state.hybridParentId ? D.RACES.find(r=>r.id===state.hybridParentId) : null;
     return `<h3 style="margin-top:1.6rem">Trait « Hybride » <small class="help">(choisit un trait racial chez l'un de ses parents)</small></h3>
     ${race.id==="semi-elfe"?`<p class="help">Le Semi-elfe a un parent Humain et un parent Elfe — précise d'abord de quel type d'elfe il s'agit avant de choisir le trait.</p>`:""}
     <div class="field"><label>Ascendance dont le trait est hérité</label>
       <select id="f-hybridparent"><option value="">— choisir —</option>
         ${race.hybridParents.map(pid=>{ const p=D.RACES.find(r=>r.id===pid); return `<option value="${pid}" ${state.hybridParentId===pid?"selected":""}>${esc(p.name)}</option>`; }).join("")}
       </select></div>
     ${parent&&parent.hybridTraits?`<div class="field"><label>Trait hérité</label>
       <select id="f-hybridtrait"><option value="">— choisir —</option>

       </select></div>`:""}`;
   })():""}

   <h3 style="margin-top:1.6rem">Classe principale</h3>
   <div class="pick-grid">
     ${D.CLASSES_BASE.map(c=>`<div class="card-pick ${state.classMainId===c.id?'selected':''}" data-classmain="${c.id}">

   ${state.classMainId? renderClassDetail(getClass(state.classMainId)) : ""}

     </select></div>`:""}

   ${(state.classMainId==="rodeur"||state.classSecondaryId==="rodeur")?`
   <h3 style="margin-top:1.6rem">Milieu de prédilection <small class="help">(passif Rôdeur : +20 en Pister et Embuscade dans ce milieu, Chapitre III p.21)</small></h3>
   <div class="field"><label>Milieu</label>
     <input type="text" id="f-rodeurmilieu" list="milieuOptions" placeholder="ex. Forêt" value="${esc(state.rodeurMilieu||"")}">

   <p class="help" style="margin-top:.3rem">Ce bonus reste conditionnel : il ne s'ajoute pas automatiquement au score de Pister/Embuscade affiché sur la fiche, à appliquer manuellement en jeu quand ${esc(state.identity.name||"le personnage")} est dans ce milieu.</p>`:""}

   ${(state.classMainId==="mage"||state.classMainId==="ensorceleur"||state.classSecondaryId==="mage"||state.classSecondaryId==="ensorceleur")?(()=>{
     const wantsMage = state.classMainId==="mage"||state.classSecondaryId==="mage";
     const wantsEnso = state.classMainId==="ensorceleur"||state.classSecondaryId==="ensorceleur";
     const avail = D.ARCANES.filter(a=> a.restriction===null || (wantsMage&&a.restriction==="mage") || (wantsEnso&&a.restriction==="ensorceleur"));
     const chosen = getArcane(state.arcaneMain);
     return `<h3 style="margin-top:1.6rem">Arcane</h3>
     <div class="field"><label>Arcane choisie (mage/ensorceleur, niveau 1)</label>
       <select id="f-arcane"><option value="">— choisir —</option>
         ${avail.map(a=>`<option value="${a.id}" ${state.arcaneMain===a.id?"selected":""}>${esc(a.name)} — ${esc(a.archetype)}${a.restriction?` (réservé aux ${a.restriction==="mage"?"mages":"ensorceleurs"})`:""}</option>`).join("")}
       </select></div>
       ${chosen?`<div class="note"><b>${esc(chosen.name)}</b> — ${esc(chosen.archetype)}<br>${esc(chosen.bonus)} ${esc(chosen.weakness)}<br><small class="help">${esc(chosen.flavor)}</small></div>`:""}`;
   })():""}

   ${(state.classMainId==="pretre"||state.classSecondaryId==="pretre")?(()=>{
     const chosen = getDeity(state.deityId);
     return `<h3 style="margin-top:1.6rem">Divinité / ordalie vénérée <small class="help">(détermine l'oraison de prêtre gratuite)</small></h3>
     <div class="field"><label>Culte</label>
       <select id="f-deity"><option value="">— choisir —</option>
         ${D.RELIGIONS.map(cult=>`<optgroup label="${esc(cult.culture)}">${cult.deities.map(d=>`<option value="${d.id}" ${state.deityId===d.id?"selected":""}>${esc(d.name)}</option>`).join("")}</optgroup>`).join("")}
       </select></div>
       ${chosen?`<div class="note"><b>${esc(chosen.name)}</b> — ${esc(chosen.domaine)} ${chosen.align&&chosen.align!=="—"?`(${esc(chosen.align)})`:""}<br><i>Oraison de prêtre :</i> ${esc(chosen.oraison)}</div>`:""}`;
   })():""}

   <div class="field" style="margin-top:1rem"><label>Description / concept</label>
     <textarea id="f-desc" rows="3" placeholder="Qui est-il, d'où vient-il, que cherche-t-il...">${esc(state.identity.desc)}</textarea></div>

   <div class="step-foot no-print"><span></span><button class="btn" id="next1">Étape suivante →</button></div>`;

  $("#f-name").addEventListener("input", e=>{state.identity.name=e.target.value; saveState(); renderSummary();});
  $("#f-player").addEventListener("input", e=>{state.identity.player=e.target.value; saveState();});
  $("#f-align").addEventListener("input", e=>{state.identity.align=e.target.value; saveState(); renderSummary();});
  $("#f-height").addEventListener("input", e=>{state.identity.height=e.target.value; saveState();});
  $("#f-eyes").addEventListener("input", e=>{state.identity.eyes=e.target.value; saveState();});
  $("#f-hair").addEventListener("input", e=>{state.identity.hair=e.target.value; saveState();});
  $("#f-desc").addEventListener("input", e=>{state.identity.desc=e.target.value; saveState();});
  const fp=$("#f-portrait"); if(fp) fp.addEventListener("change", e=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    resizePortraitFile(file, dataUrl=>{
      if(!dataUrl) return; // fichier illisible ou non-image : on ignore silencieusement
      state.identity.portrait = dataUrl;
      saveState(); renderStep1(root); renderSummary();
    });
  });
  const rmp=$("#removePortrait"); if(rmp) rmp.addEventListener("click", ()=>{
    state.identity.portrait = null; saveState(); renderStep1(root); renderSummary();
  });
  const fa=$("#f-arcane"); if(fa) fa.addEventListener("change", e=>{state.arcaneMain=e.target.value||null; saveState(); renderStep1(root); renderSummary();});
  const fd=$("#f-deity"); if(fd) fd.addEventListener("change", e=>{state.deityId=e.target.value||null; saveState(); renderStep1(root); renderSummary();});
  const fw=$("#f-guerrierweapon"); if(fw) fw.addEventListener("change", e=>{state.guerrierWeaponId=e.target.value||null; saveState(); renderSummary();});
  const fv=$("#f-vampirechoice"); if(fv) fv.addEventListener("change", e=>{state.vampireChoice=e.target.value||null; saveState(); renderSummary();});
  const frm=$("#f-rodeurmilieu"); if(frm) frm.addEventListener("change", e=>{state.rodeurMilieu=e.target.value.trim()||null; saveState(); renderSummary();});
  const fse=$("#f-semielfebonus"); if(fse) fse.addEventListener("change", e=>{state.semiElfeParentBonus=e.target.value||null; saveState(); renderStep1(root); renderSummary();});
  const fhp=$("#f-hybridparent"); if(fhp) fhp.addEventListener("change", e=>{state.hybridParentId=e.target.value||null; state.hybridTraitIdx=null; saveState(); renderStep1(root); renderSummary();});
  const fht=$("#f-hybridtrait"); if(fht) fht.addEventListener("change", e=>{const v=e.target.value; state.hybridTraitIdx=v===""?null:parseInt(v,10); saveState(); renderStep1(root); renderSummary();});
  $$("#race-grid .card-pick").forEach(el=> el.addEventListener("click", ()=>{
    state.raceId=el.dataset.race; state.raceChoiceBonuses=[];
    // Change de race : les choix liés à l'ancienne race (parent hybride, +1 du parent elfe,
    // âge du vampire, milieu du rôdeur reste lié à la classe donc conservé) n'ont plus de sens.
    state.hybridParentId=null; state.hybridTraitIdx=null; state.semiElfeParentBonus=null; state.vampireChoice=null;
    saveState(); renderStep1(root); renderSummary();
  }));
  $$("[data-classmain]").forEach(el=> el.addEventListener("click", ()=>{ state.classMainId=el.dataset.classmain||null; saveState(); renderStep1(root); renderSummary(); }));
  $$("[data-classsec]").forEach(el=> el.addEventListener("click", ()=>{ state.classSecondaryId=el.dataset.classsec||null; saveState(); renderStep1(root); renderSummary(); }));
  $("#next1").addEventListener("click", ()=>go(1));
}
function fmtBonus(b){
  const lbl=b.stat;
  if(b.op==="mult") return `x${b.val} ${lbl}`;
  if(b.op==="div") return `/${b.val} ${lbl}`;
  return `${b.val>0?"+":""}${b.val} ${lbl}`;
}
function renderRaceDetail(race){
  return `<div class="note"><b>${esc(race.name)}</b> — ${race.traits.map(esc).join(" · ")}
   ${race.choice?`<div style="margin-top:.6rem">Choisissez ${race.choice} caractéristique(s) à augmenter de +1 :
     ${D.STATS.map(s=>`<label style="margin-right:.8rem"><input type="checkbox" data-choicebonus="${s}" ${state.raceChoiceBonuses.includes(s)?"checked":""}> ${s}</label>`).join("")}
   </div>`:""}
   </div>`;
}
function renderClassDetail(c){
  return `<div class="note"><b>${esc(c.name)}</b><br>
    <b>Niveau 1 :</b> ${esc(c.n1)}<br>
    ${c.n3?`<b>Niveau 3 :</b> ${esc(c.n3)}<br>`:""}
    ${c.n5?`<b>Niveau 5 :</b> ${esc(c.n5)}<br>`:""}
    ${c.n10?`<b>Niveau 10 :</b> ${esc(c.n10)}<br>`:""}
    <b>Passif :</b> ${esc(c.passif)}</div>`;
}

/* attach choice-bonus checkboxes after step1 render (delegated) */
document.addEventListener("change", e=>{
  if(e.target.matches("[data-choicebonus]")){
    const s=e.target.dataset.choicebonus; const race=getRace(); if(!race) return;
    const max=race.choice||0;
    if(e.target.checked){
      if(state.raceChoiceBonuses.length>=max){ e.target.checked=false; return; }
      state.raceChoiceBonuses.push(s);
    } else { state.raceChoiceBonuses=state.raceChoiceBonuses.filter(x=>x!==s); }
    saveState(); renderSummary();
  }
});

window.ADA.core = {D,ALL_WEAPON_BRANCHES,$,$$,esc,state,saveState,mod,getRace,getClass,getArcane,getDeity,hasClass,statBase,statFinal,statModFinal,
 civilBudget,civilSpent,weaponPoolBase,weaponArbrePoints,weaponMasteryPoints,weaponArbreSpent,weaponMasterySpent,
 magicPoolBase,magicArbrePoints,magicMasteryPoints,magicArbreSpent,magicMasterySpent,pvValue,goldStart,languageCount,
 currentPV,currentGold,XP_THRESHOLDS,nextLevelXP,dieAtRank,magicDieForLevel,
 traitBonuses,racialSkillNote,fixedSkillSources,fixedSkillBonuses,allSkillBonuses,getHybridChoice,d6,roll4d6drop,STEPS,go,renderRail,renderSummary,renderStep1,fmtBonus,freshState};
})();

<script>
/* =====================================================================
   ÉTAPES 2 à 8
   ===================================================================== */
(function(){
"use strict";
const core = window.ADA.core, D=core.D, $=core.$, $$=core.$$, esc=core.esc;
function state(){ return core.state; }

/* ---------- STEP 2 : caractéristiques ---------- */
function renderStep2(root){
  const s=core.state;
  let manualOpen=false;
  root.innerHTML = `
   <div class="step-head"><div><div class="eyebrow">Chapitre I bis</div><h2>Caractéristiques</h2></div>
     <div class="no-print" style="display:flex;gap:.5rem;flex-wrap:wrap">
       <button class="btn secondary small" id="rollAll">🎲 Lancer les 6 caractéristiques (4d6, retire le plus faible)</button>
       <button class="btn ghost small" id="manualToggle">✍️ Saisir mes jets manuellement</button>
     </div></div>
   <p class="help" style="color:var(--ink-soft)">Assignez chaque résultat obtenu à l'une des six caractéristiques. Le bonus/malus racial et vos choix libres sont appliqués automatiquement.</p>
   <div id="manualPanel" class="no-print" style="display:none;margin-bottom:1.1rem;border:1px solid var(--border);border-radius:8px;padding:.9rem 1rem;background:var(--surface-2)"></div>
   <div id="rollsRow" class="dice-row" style="margin-bottom:1.1rem"></div>
   <div class="stat-grid" id="statGrid"></div>
   <div class="step-foot no-print"><button class="btn secondary" id="prev2">← Précédent</button><button class="btn" id="next2">Étape suivante →</button></div>`;

  function paintManualPanel(){
    const panel=$("#manualPanel");
    panel.style.display = manualOpen?"":"none";
    if(!manualOpen) return;
    const vals = Array.from({length:6},(_,i)=> s.rolls[i]!=null?s.rolls[i]:"");
    panel.innerHTML = `
      <p class="help" style="color:var(--ink-soft);margin-top:0">Vous avez lancé vos dés physiquement ? Entrez vos 6 résultats (4d6 en retirant le plus faible, soit un total entre 3 et 18 chacun), puis assignez-les ci-dessous comme d'habitude.</p>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end">
        ${Array.from({length:6},(_,i)=>`<div class="field" style="margin-bottom:0"><label>Jet ${i+1}</label><input type="number" min="3" max="18" step="1" data-manual="${i}" value="${vals[i]}" style="width:4.6rem;text-align:center"></div>`).join("")}
      </div>
      <div style="margin-top:.7rem;display:flex;gap:.6rem;align-items:center">
        <button class="btn small" id="manualApply">Valider ces jets</button>
        <span id="manualErr" class="help" style="color:var(--danger)"></span>
      </div>`;
    $("#manualApply").addEventListener("click", ()=>{
      const inputs = $$("#manualPanel [data-manual]");
      const nums = inputs.map(inp=> inp.value===""?null:parseInt(inp.value,10));
      if(nums.some(n=> n==null || isNaN(n) || n<3 || n>18)){
        $("#manualErr").textContent = "Chaque jet doit être un nombre entre 3 et 18.";
        return;
      }
      s.rolls = nums;
      D.STATS.forEach(st=> s.statRollIndex[st]=null);
      core.saveState(); paintRolls(); paintStats(); core.renderSummary();
      $("#manualErr").textContent = "Jets enregistrés — assignez-les ci-dessous.";
    });
  }

  function paintRolls(){
    const used = Object.values(s.statRollIndex);
    $("#rollsRow").innerHTML = (s.rolls.length? s.rolls.map((v,i)=>{
      const usedBy = D.STATS.find(st=>s.statRollIndex[st]===i);
      return `<span class="dieface ${usedBy?'dropped':''}" title="${usedBy?('Assigné à '+usedBy):'Disponible'}">${v}</span>`;
    }).join("") : `<span class="help" style="color:var(--ink-faint)">Aucun jet effectué.</span>`);
  }
  function paintStats(){
    $("#statGrid").innerHTML = D.STATS.map(stat=>{
      const options = [`<option value="">—</option>`].concat(s.rolls.map((v,i)=>{
        const usedBy = D.STATS.find(st=>s.statRollIndex[st]===i);
        const disabled = usedBy && usedBy!==stat;
        return `<option value="${i}" ${s.statRollIndex[stat]===i?"selected":""} ${disabled?"disabled":""}>${v}${disabled?` (→ ${usedBy})`:""}</option>`;
      })).join("");
      const fin = core.statFinal(stat), m = core.statModFinal(stat);
      const race = core.getRace();
      let raceBits=[];
      if(race){ race.bonus.concat(race.malus).forEach(b=>{ if(b.stat===stat) raceBits.push(core.fmtBonus(b)); }); }
      (s.raceChoiceBonuses||[]).forEach(st=>{ if(st===stat) raceBits.push("+1 (choix libre)"); });
      return `<div class="stat-card">
        <div class="lbl">${D.STAT_LABELS[stat]}</div>
        <select data-stat="${stat}" style="width:100%;margin:.4rem 0">${options}</select>
        <div class="val tabular">${fin==null?"–":fin}</div>
        <div class="mod tabular">${m==null?"":(m>=0?"+":"")+m+" mod."}</div>
        <div class="breakdown">${raceBits.length?esc(raceBits.join(", ")):"aucun bonus racial"}</div>
      </div>`;
    }).join("");
    $$("#statGrid select").forEach(sel=> sel.addEventListener("change", e=>{
      const stat=e.target.dataset.stat; const val=e.target.value;
      s.statRollIndex[stat] = val===""?null:parseInt(val,10);
      core.saveState(); paintRolls(); paintStats(); core.renderSummary();
    }));
  }
  $("#rollAll").addEventListener("click", ()=>{
    s.rolls = Array.from({length:6},()=>core.roll4d6drop().total);
    D.STATS.forEach(st=> s.statRollIndex[st]=null);
    core.saveState(); paintRolls(); paintStats(); core.renderSummary();
    $("#rollsRow .dieface")?.classList?.add("rolling");
  });
  $("#manualToggle").addEventListener("click", ()=>{ manualOpen=!manualOpen; paintManualPanel(); });
  $("#prev2").addEventListener("click", ()=>core.go(0));
  $("#next2").addEventListener("click", ()=>core.go(2));
  paintRolls(); paintStats(); paintManualPanel();
}

/* ---------- STEP 3 : compétences civiles ---------- */
function renderStep3(root){
  const s=core.state;
  if(!s.masteries) s.masteries={};
  root.innerHTML = `
   <div class="step-head"><div><div class="eyebrow">Chapitre III</div><h2>Compétences civiles</h2></div>
     <button class="btn ghost small no-print" id="resetSkills" title="Remet tous les points de compétences civiles à zéro et efface les maîtrises choisies">↺ Réinitialiser les compétences</button></div>
   <p class="help" style="color:var(--ink-soft)">Le budget de chaque catégorie = valeur de la caractéristique associée × 6. Score plafonné à 100 (ramené à 80 en jeu, avec choix d'une maîtrise).</p>
   <div id="catList"></div>
   <div class="step-foot no-print"><button class="btn secondary" id="prev3">← Précédent</button><button class="btn" id="next3">Étape suivante →</button></div>`;
  function paint(){
    $("#catList").innerHTML = Object.keys(D.SKILL_CATEGORIES).map(cat=>{
      const budget=core.civilBudget(cat), spent=core.civilSpent(cat), remain=budget-spent;
      return `<details class="skillcat" open>
        <summary><span>${cat} <small class="help" style="text-transform:none;letter-spacing:0">(${D.STAT_LABELS[D.CATEGORY_STAT[cat]]})</small></span>
          <span class="badge ${remain<0?'neg':'pos'}">${spent} / ${budget} pts</span></summary>
        ${D.SKILL_CATEGORIES[cat].map(sk=>{
          const b=core.allSkillBonuses()[sk];
          const bonusTitle = b? b.parts.map(p=>`${p.label} ${p.amount>0?"+":""}${p.amount}`).join(", ") : "";
          const rawTotal = (s.civil[sk]||0)+(b?b.total:0);
          const cappedTotal = Math.min(100, rawTotal);
          const mastered = cappedTotal>=100;
          const scoreLabel = mastered ? "100 → 80 (maîtrise)" : (b? ((b.total>0?"+":"")+b.total+" → "+cappedTotal) : "");
          const chosen = s.masteries[sk]||[];
          return `<div class="skillrow">
            <span class="name">${esc(sk)}</span>
            <span class="bonus" ${bonusTitle?`title="${esc(bonusTitle)}"`:""}>${scoreLabel}</span>
            <span class="stepper">
              <button data-dec="${esc(sk)}" type="button">–</button>
              <input type="number" min="0" max="100" data-skill="${esc(sk)}" value="${s.civil[sk]||0}">
              <button data-inc="${esc(sk)}" type="button">+</button>
            </span></div>
            ${mastered? `<div class="note" style="margin:.2rem 0 .7rem">
              <b>Maîtrise de ${esc(sk)}</b> <small class="help">— choisissez une option (Artisanat et Connaissance peuvent en cumuler plusieurs, voir leur option « ouvre un autre champ »)</small>
              ${(D.MASTERIES[sk]||[]).map((opt,i)=>`<label style="display:flex;gap:.5rem;align-items:flex-start;margin-top:.5rem;font-size:.85rem;cursor:pointer">
                <input type="checkbox" data-masterychoice="${esc(sk)}" data-idx="${i}" ${chosen.includes(opt)?"checked":""} style="margin-top:.2rem">
                <span>${esc(opt)}</span>
              </label>`).join("")}
            </div>` : ""}`;
        }).join("")}
      </details>`;
    }).join("");
    $$("#catList input[data-skill]").forEach(inp=> inp.addEventListener("change", e=>{
      let v=parseInt(e.target.value,10); if(isNaN(v)||v<0) v=0; if(v>100) v=100;
      s.civil[e.target.dataset.skill]=v; core.saveState(); paint(); core.renderSummary();
    }));
    $$("#catList [data-inc]").forEach(b=> b.addEventListener("click", ()=>{ const sk=b.dataset.inc; s.civil[sk]=Math.min(100,(s.civil[sk]||0)+1); core.saveState(); paint(); core.renderSummary(); }));
    $$("#catList [data-dec]").forEach(b=> b.addEventListener("click", ()=>{ const sk=b.dataset.dec; s.civil[sk]=Math.max(0,(s.civil[sk]||0)-1); core.saveState(); paint(); core.renderSummary(); }));
    $$("#catList [data-masterychoice]").forEach(cb=> cb.addEventListener("change", e=>{
      const sk=e.target.dataset.masterychoice; const idx=parseInt(e.target.dataset.idx,10);
      const opt=(D.MASTERIES[sk]||[])[idx]; if(opt==null) return;
      if(!s.masteries[sk]) s.masteries[sk]=[];
      if(e.target.checked){ if(!s.masteries[sk].includes(opt)) s.masteries[sk].push(opt); }
      else { s.masteries[sk]=s.masteries[sk].filter(x=>x!==opt); }
      core.saveState(); core.renderSummary();
    }));
  }
  $("#resetSkills").addEventListener("click", ()=>{ s.civil={}; s.masteries={}; core.saveState(); paint(); core.renderSummary(); });
  $("#prev3").addEventListener("click", ()=>core.go(1));
  $("#next3").addEventListener("click", ()=>core.go(3));
  paint();
}

/* ---------- STEP 4 : traits naturels ---------- */
function allSkillNames(){ return Object.values(D.SKILL_CATEGORIES).flat(); }
function renderStep4(root){
  const s=core.state;
  root.innerHTML = `
   <div class="step-head"><div><div class="eyebrow">Chapitre IV</div><h2>Traits naturels</h2></div></div>
   <p class="help" style="color:var(--ink-soft)">Le premier trait est gratuit et obligatoire (+10 à une compétence). Vous pouvez ensuite ajouter jusqu'à deux traits positifs supplémentaires, chacun équilibré par un trait négatif de même valeur.</p>
   <div class="field"><label>Trait gratuit (obligatoire, +10)</label>
     <select id="freeTrait"><option value="">— choisir une compétence —</option>
       ${allSkillNames().map(sk=>`<option value="${esc(sk)}" ${s.traitFree&&s.traitFree.skill===sk?"selected":""}>${esc(sk)} → ${esc(D.NATURAL_TRAITS[sk][0])} (+10)</option>`).join("")}
     </select></div>
   <div id="pairsZone"></div>
   <button class="btn secondary small no-print" id="addPair">+ Ajouter une paire (positif / négatif)</button>
   <div class="step-foot no-print"><button class="btn secondary" id="prev4">← Précédent</button><button class="btn" id="next4">Étape suivante →</button></div>`;

  function paintPairs(){
    $("#pairsZone").innerHTML = (s.traitPairs||[]).map((p,i)=>`
      <div class="note" style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center">
        <div class="field" style="flex:1;min-width:200px;margin:0"><label>Trait positif (+10)</label>
          <select data-pair="${i}" data-side="pos">${allSkillNames().map(sk=>`<option value="${esc(sk)}" ${p.pos===sk?"selected":""}>${esc(sk)} → ${esc(D.NATURAL_TRAITS[sk][0])}</option>`).join("")}</select></div>
        <div class="field" style="flex:1;min-width:200px;margin:0"><label>Trait négatif (-10)</label>
          <select data-pair="${i}" data-side="neg">${allSkillNames().map(sk=>`<option value="${esc(sk)}" ${p.neg===sk?"selected":""}>${esc(sk)} → ${esc(D.NATURAL_TRAITS[sk][1])}</option>`).join("")}</select></div>
        <button class="btn ghost small no-print" data-removepair="${i}">Retirer</button>
      </div>`).join("");
    $$("#pairsZone select").forEach(sel=> sel.addEventListener("change", e=>{
      const i=parseInt(e.target.dataset.pair,10), side=e.target.dataset.side;
      s.traitPairs[i][side]=e.target.value; core.saveState(); core.renderSummary();
    }));
    $$("#pairsZone [data-removepair]").forEach(b=> b.addEventListener("click", ()=>{
      s.traitPairs.splice(parseInt(b.dataset.removepair,10),1); core.saveState(); paintPairs(); paintAddBtn();
    }));
  }
  function paintAddBtn(){ $("#addPair").style.display = (s.traitPairs||[]).length>=2 ? "none":"inline-block"; }
  $("#freeTrait").addEventListener("change", e=>{
    const sk=e.target.value; s.traitFree = sk?{skill:sk,label:D.NATURAL_TRAITS[sk][0]}:null; core.saveState(); core.renderSummary();
  });
  $("#addPair").addEventListener("click", ()=>{
    if((s.traitPairs||[]).length>=2) return;
    const names=allSkillNames();
    s.traitPairs.push({pos:names[0],neg:names[1]});
    core.saveState(); paintPairs(); paintAddBtn();
  });
  $("#prev4").addEventListener("click", ()=>core.go(2));
  $("#next4").addEventListener("click", ()=>core.go(4));
  paintPairs(); paintAddBtn();
}

/* ---------- STEP 5 & 6 : arbres (générique) ---------- */
function renderTreeStep(root, opts){
  const s=core.state;
  const groups = {};
  opts.branches.forEach(b=>{ (groups[b.group]=groups[b.group]||[]).push(b); });

  root.innerHTML = `
   <div class="step-head"><div><div class="eyebrow">${opts.chapter}</div><h2>${opts.title}</h2></div></div>
   ${opts.statChooser? opts.statChooser() : ""}
   <div class="budget" id="budgetBar"></div>
   <div id="branchZone"></div>
   <div class="step-foot no-print"><button class="btn secondary" id="prevT">← Précédent</button><button class="btn" id="nextT">Étape suivante →</button></div>`;

  function branchState(id){ return opts.store()[id] || (opts.store()[id]={unlocked:false, mastery:0, chances:0, de:0, crit:0, dieOverride:null, dmgPts:0}); }

  function paintBudget(){
    const arbrePts=opts.arbrePts(), masteryPts=opts.masteryPts(), arbreSpent=opts.arbreSpent(), masterySpent=opts.masterySpent();
    const canConvert = opts.convert && (masteryPts-masterySpent)>=5;
    $("#budgetBar").innerHTML = `
     <span>Points d'arbre : <b class="tabular ${arbrePts-arbreSpent<0?'over':'ok'}">${arbreSpent} / ${arbrePts}</b></span>
     <span>Points de maîtrise : <b class="tabular ${masteryPts-masterySpent<0?'over':'ok'}">${masterySpent} / ${masteryPts}</b></span>
     ${opts.convert?`<button type="button" class="btn ghost small no-print" id="convertBtn" ${canConvert?"":"disabled"}
        title="Transforme 5 points de maîtrise inutilisés en 1 point d'arbre supplémentaire (Chapitres VII p.4 et X p.82)">⇄ 5 pts maîtrise → 1 pt d'arbre</button>`:""}`;
    if(opts.convert){
      const b=$("#convertBtn");
      if(b) b.addEventListener("click", ()=>{ if((opts.masteryPts()-opts.masterySpent())<5) return; opts.convert(); paint(); core.renderSummary(); });
    }
  }

  function paint(){
    paintBudget();
    const arbreLeft = opts.arbrePts()-opts.arbreSpent();
    const masteryLeft = opts.masteryPts()-opts.masterySpent();
    $("#branchZone").innerHTML = Object.keys(groups).map(g=>`
      <h3 style="margin-top:1.3rem">${esc(g)}</h3>
      ${groups[g].map(b=>{
        const bs=branchState(b.id);
        const classBonus = (core.state.guerrierWeaponId===b.id && core.hasClass("guerrier")) ? 10 : 0;
        const vampireBonus = (core.state.raceId==="vampire" && core.state.vampireChoice==="jeunesse" && (b.kind==="weapon"||b.kind==="armor")) ? 10 : 0;
        // +5% de maîtrise par nœud "+5% chances" (cumulable 3 fois) — uniquement pour les branches d'armes :
        // sur les branches d'armure, bs.chances sert à compter les points d'ARM (mécanique différente).
        const chancesBonus = (b.kind==="weapon") ? (bs.chances||0)*5 : 0;
        const masteryVal = bs.unlocked ? 25+(bs.mastery||0)+classBonus+vampireBonus+chancesBonus : 0;
        return `<div class="branch">
          <div class="bhead">
            <h4>${esc(b.name)}${b.stat?` <small class="help">(${b.stat})</small>`:""}${classBonus?` <small class="help" style="color:var(--gold)">+10 don Guerrier</small>`:""}${vampireBonus?` <small class="help" style="color:var(--gold)">+10 fougue de la jeunesse</small>`:""}</h4>
            ${bs.unlocked? `<span class="mastery tabular">${Math.min(masteryVal,100)}%</span><button class="btn ghost small no-print" data-lock="${b.id}" title="Réinitialise cette branche et rend les points d'arbre et de maîtrise dépensés dessus">✕ Réinitialiser</button>` : `<button class="btn small no-print" data-unlock="${b.id}" ${arbreLeft<1?"disabled":""}>Débloquer (1 pt d'arbre)</button>`}
          </div>
          ${bs.unlocked? renderBranchBody(b,bs,arbreLeft,masteryLeft) : ""}
        </div>`;
      }).join("")}
    `).join("");
    wire();
  }
  function nodeRow(label, key, max, bs, arbreLeft, branchId){
    const current = bs[key]||0;
    let html=`<div>`;
    for(let i=1;i<=max;i++){
      const bought = current>=i;
      const isNext = current+1===i;
      const locked = !bought && !isNext;
      html += `<span class="node ${bought?'bought':''} ${locked?'locked':''}" data-node="${branchId}|${key}|${i}" title="${label} — niveau ${i}/${max}">${label} (${i}/${max})</span>`;
    }
    html+=`</div>`;
    return html;
  }
  const masteryStepper = (b,bs)=>`<div style="padding:0 .9rem .9rem">
        <label class="help">Points de maîtrise investis (maîtrise = 25 + investis) :</label>
        <span class="stepper"><button data-mdec="${b.id}" type="button">–</button><input type="number" data-mastery="${b.id}" value="${bs.mastery||0}" min="0"><button data-minc="${b.id}" type="button">+</button></span>
      </div>`;
  function renderBranchBody(b,bs,arbreLeft,masteryLeft){
    if(b.kind==="armor"){
      return `<div class="nodes">
        <span class="node" data-armnode="${b.id}" data-armdir="1" title="Ajouter 1 point d'armure (coût 1 pt d'arbre)">Armure ${bs.chances||0} — +1 ARM</span>
        <span class="node" data-armnode="${b.id}" data-armdir="-1" title="Retirer 1 point d'armure">− ARM</span>
        ${nodeRow("+1 DE bouclier","de",3,bs,arbreLeft,b.id)}
      </div>
      <div class="special"><b>Contenu :</b> ${esc(b.items)}</div>
      ${masteryStepper(b,bs)}`;
    }
    if(b.kind==="magic"){
      const dmgDie = core.magicDieForLevel(core.state.level||1);
      const intMod = core.statModFinal("INT");
      return `<div class="nodes">
        <span class="node" data-magicdmg="${b.id}" data-magicdmgdir="1" title="Investir 1 point d'arbre pour +1 point de dégâts (coût 1 pt d'arbre)">Dégâts +${bs.dmgPts||0} — +1 point</span>
        <span class="node" data-magicdmg="${b.id}" data-magicdmgdir="-1" title="Retirer 1 point de dégâts">− dégâts</span>
      </div>
      <div class="special" style="display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center">
        <span><b>Dégâts :</b> <span class="tabular" style="font-size:1.05rem;color:var(--accent)">${esc(dmgDie)}${(bs.dmgPts||0)>0?` +${bs.dmgPts}`:""}</span> <span class="help">+ mod. Intelligence${intMod!=null?` (${intMod>=0?"+":""}${intMod})`:""}</span></span>
      </div>
      <div class="help" style="padding:0 .9rem .4rem;font-size:.72rem">Dé de magie basé sur le niveau du personnage (niveau ${core.state.level||1} → ${esc(dmgDie)}, Chapitre VI p.41). Change avec le niveau renseigné à l'étape VIII.</div>
      ${masteryStepper(b,bs)}`;
    }
    const currentDie = core.dieAtRank(bs.dieOverride||b.baseDie, bs.de||0);
    return `<div class="nodes">
        ${nodeRow("+5% chances","chances",3,bs,arbreLeft,b.id)}
        ${nodeRow("+1 dé","de",3,bs,arbreLeft,b.id)}
        ${nodeRow("+1/+3/+5 crit","crit",3,bs,arbreLeft,b.id)}
      </div>
      <div class="special" style="display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center">
        <span><b>Dégâts :</b> <span class="tabular" style="font-size:1.05rem;color:var(--accent)">${esc(currentDie)}</span>${b.stat?` <span class="help">+ mod. ${b.stat}</span>`:""}</span>
        <label class="help" style="margin-left:auto;display:flex;align-items:center;gap:.4rem">Dé de base
          <select data-diebase="${b.id}">
            ${D.DIE_RANKS.map(dr=>`<option value="${dr}" ${(bs.dieOverride||b.baseDie)===dr?"selected":""}>${dr}</option>`).join("")}
          </select>
        </label>
      </div>
      <div class="help" style="padding:0 .9rem .4rem;font-size:.72rem">Tableau de dégâts indicatif (p.56 du livre) — ajustez le dé de base selon l'arme précise choisie et les indications de votre MJ.</div>
      ${b.special?`<div class="special"><b>${((bs.chances||0)+(bs.de||0)+(bs.crit||0))>=9?"Capacité débloquée":"Capacité spéciale (9 nœuds requis)"} :</b> ${esc(b.special)}</div>`:""}
      ${masteryStepper(b,bs)}`;
  }
  function wire(){
    $$("#branchZone [data-unlock]").forEach(btn=> btn.addEventListener("click", ()=>{
      if(opts.arbrePts()-opts.arbreSpent()<1) return;
      branchState(btn.dataset.unlock).unlocked=true; core.saveState(); paint(); core.renderSummary();
    }));
    $$("#branchZone [data-lock]").forEach(btn=> btn.addEventListener("click", ()=>{
      opts.store()[btn.dataset.lock] = {unlocked:false, mastery:0, chances:0, de:0, crit:0, dieOverride:null, dmgPts:0};
      core.saveState(); paint(); core.renderSummary();
    }));
    $$("#branchZone [data-node]").forEach(n=> n.addEventListener("click", ()=>{
      const [bid,key,idx]=n.dataset.node.split("|"); const bs=branchState(bid); const i=parseInt(idx,10);
      const current=bs[key]||0;
      if(current>=i){ bs[key]=i-1; } // toggle off (retire ce nœud et les suivants)
      else if(current+1===i){ if(opts.arbrePts()-opts.arbreSpent()<1) return; bs[key]=i; }
      core.saveState(); paint(); core.renderSummary();
    }));
    $$("#branchZone [data-armnode]").forEach(n=> n.addEventListener("click", ()=>{
      const bs=branchState(n.dataset.armnode); const dir=parseInt(n.dataset.armdir,10);
      if(dir>0 && opts.arbrePts()-opts.arbreSpent()<1) return;
      bs.chances=Math.max(0,(bs.chances||0)+dir); core.saveState(); paint(); core.renderSummary();
    }));
    $$("#branchZone [data-minc]").forEach(b=> b.addEventListener("click", ()=>{
      const bs=branchState(b.dataset.minc); if(opts.masteryPts()-opts.masterySpent()<1) return;
      bs.mastery=(bs.mastery||0)+1; core.saveState(); paint(); core.renderSummary();
    }));
    $$("#branchZone [data-mdec]").forEach(b=> b.addEventListener("click", ()=>{
      const bs=branchState(b.dataset.mdec); bs.mastery=Math.max(0,(bs.mastery||0)-1); core.saveState(); paint(); core.renderSummary();
    }));
    $$("#branchZone [data-mastery]").forEach(inp=> inp.addEventListener("change", e=>{
      const bs=branchState(e.target.dataset.mastery); let v=parseInt(e.target.value,10)||0; if(v<0)v=0;
      bs.mastery=v; core.saveState(); paint(); core.renderSummary();
    }));
    $$("#branchZone [data-diebase]").forEach(sel=> sel.addEventListener("change", e=>{
      const bs=branchState(e.target.dataset.diebase); bs.dieOverride=e.target.value; core.saveState(); paint(); core.renderSummary();
    }));
    $$("#branchZone [data-magicdmg]").forEach(n=> n.addEventListener("click", ()=>{
      const bs=branchState(n.dataset.magicdmg); const dir=parseInt(n.dataset.magicdmgdir,10);
      if(dir>0 && opts.arbrePts()-opts.arbreSpent()<1) return;
      bs.dmgPts=Math.max(0,(bs.dmgPts||0)+dir); core.saveState(); paint(); core.renderSummary();
    }));
  }
  $("#prevT").addEventListener("click", opts.onPrev);
  $("#nextT").addEventListener("click", opts.onNext);
  paint();
}

    chapter:"Chapitre VII", title:"Arbre de combat",
    branches: D.WEAPON_BRANCHES.map(w=>Object.assign({},w,{kind:"weapon"}))
      .concat(D.ARMOR_BRANCHES.map(a=>Object.assign({},a,{kind:"armor",special:null}))),
    statChooser: ()=>`<div class="field" style="max-width:340px"><label>Caractéristique utilisée</label>

    arbrePts: core.weaponArbrePoints, masteryPts: core.weaponMasteryPoints,

    onPrev: ()=>core.go(3), onNext: ()=>core.go(5),

  const branches = [];
  D.MAGIC_SCHOOLS.forEach(sc=> sc.sub.forEach(sub=> branches.push({id:sc.id+"-"+sub, name:sub, group:sc.name+" ("+sc.alt+")", stat:null, special:null, kind:"magic"})));

    chapter:"Chapitre VI", title:"Arbre de magie",

  });
}

/* ---------- STEP 7 : PV & or ---------- */
function renderStep7(root){
  const s=core.state;
  root.innerHTML = `
   <div class="step-head"><div><div class="eyebrow">Chapitre X</div><h2>Points de vie &amp; or de départ</h2></div></div>
   <div class="grid2">
     <div class="stat-card" style="text-align:left;padding:1.1rem">
       <div class="lbl">Points de vie</div>
       <div class="val tabular">${core.pvValue()==null?"–":core.pvValue()}</div>
       <div class="breakdown">Moyenne de Force (${core.statFinal("FOR")??"–"}) et Constitution (${core.statFinal("CON")??"–"})</div>
     </div>
     <div class="stat-card" style="text-align:left;padding:1.1rem">
       <div class="lbl">Or de départ</div>
       <div class="val tabular">${core.goldStart()} PO</div>
       <div class="breakdown">Moitié du salaire au bis de la classe sociale (plafond 1000 PO)</div>
     </div>
   </div>
   <h3 style="margin-top:1.4rem">Classe sociale</h3>
   <div class="pick-grid">
     ${D.SOCIAL_CLASSES.map(sc=>`<div class="card-pick ${s.socialClassId===sc.id?'selected':''}" data-social="${sc.id}">
        <h4>${esc(sc.name)}</h4><p>${sc.salary} Cl / bis</p></div>`).join("")}
   </div>
   <h3 style="margin-top:1.4rem">Langues</h3>
   <p class="help" style="color:var(--ink-soft)">Vous pouvez choisir <b id="langMax"></b> langue(s) (modificateur d'Intelligence + 1, minimum 1). <span id="langCount"></span></p>
   <div id="langPicker"></div>
   <div class="step-foot no-print"><button class="btn secondary" id="prev7">← Précédent</button><button class="btn" id="next7">Étape suivante →</button></div>`;
  $$("[data-social]").forEach(el=> el.addEventListener("click", ()=>{ s.socialClassId=el.dataset.social; core.saveState(); renderStep7(root); core.renderSummary(); }));
  $("#prev7").addEventListener("click", ()=>core.go(5));
  $("#next7").addEventListener("click", ()=>core.go(7));

  function paintLanguages(){
    const max = core.languageCount();
    $("#langMax").textContent = max;
    if(!s.languages) s.languages=[];
    if(s.languages.length>max){ s.languages=s.languages.slice(0,max); core.saveState(); }
    $("#langCount").textContent = `(${s.languages.length}/${max} sélectionnée${s.languages.length>1?"s":""})`;
    const groups = [["courantes","Langues courantes"],["anciennes","Langues anciennes"],["diverses","Langues & dialectes divers"]];
    $("#langPicker").innerHTML = groups.map(([key,label])=>`
      <div style="margin-bottom:.8rem">
        <div class="lbl" style="font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:.4rem">${label}</div>
        <div class="pillrow">
          ${D.LANGUAGES[key].map(lg=>{
            const checked = s.languages.includes(lg);
            const disabled = !checked && s.languages.length>=max;
            return `<label class="badge ${checked?'pos':''}" style="cursor:${disabled?'not-allowed':'pointer'};opacity:${disabled?.5:1}">
              <input type="checkbox" data-lang="${esc(lg)}" ${checked?"checked":""} ${disabled?"disabled":""} style="margin:0 .3em 0 0">${esc(lg)}
            </label>`;
          }).join("")}
        </div>
      </div>`).join("");
    $$("#langPicker [data-lang]").forEach(cb=> cb.addEventListener("change", e=>{
      const lg=e.target.dataset.lang;
      if(e.target.checked){ if(!s.languages.includes(lg) && s.languages.length<max) s.languages.push(lg); }
      else { s.languages = s.languages.filter(x=>x!==lg); }
      core.saveState(); paintLanguages(); core.renderSummary();
    }));
  }
  paintLanguages();
}

/* ---------- STEP 8 : équipement + fiche finale ---------- */
function renderStep8(root){
  const s=core.state; const race=core.getRace(), cls=core.getClass(s.classMainId), cls2=core.getClass(s.classSecondaryId);
  root.innerHTML = `
   <div class="step-head"><div><div class="eyebrow">Chapitre VIII</div><h2>Équipement, histoire &amp; fiche finale</h2></div>
     <div class="no-print" style="display:flex;gap:.5rem;flex-wrap:wrap">
       <button class="btn no-print" id="exportBtn" style="display:none">💾 Télécharger la fiche (imprimable)</button>
       <button class="btn secondary no-print" id="printBtn">🖨 Imprimer directement</button>
     </div></div>
   <p id="exportStatus" class="help no-print" style="color:var(--ink-soft);min-height:1.2em"></p>
   <div class="grid2 no-print">
     <div class="field"><label>Équipement de départ</label><textarea id="f-equip" rows="5" placeholder="Armes, armures, sac à dos, provisions...">${esc(s.equipmentText)}</textarea></div>
     <div class="field"><label>Histoire complémentaire</label><textarea id="f-hist" rows="5" placeholder="Notes additionnelles sur le passé du personnage...">${esc(s.historyText)}</textarea></div>
   </div>
   <div id="sheet" class="sheet" style="margin-top:1.6rem"></div>
   <div class="step-foot no-print"><button class="btn secondary" id="prev8">← Précédent</button><span></span></div>`;
  $("#f-equip").addEventListener("input", e=>{ s.equipmentText=e.target.value; core.saveState(); paintSheet(); });
  $("#f-hist").addEventListener("input", e=>{ s.historyText=e.target.value; core.saveState(); paintSheet(); });
  $("#prev8").addEventListener("click", ()=>core.go(6));
  $("#printBtn").addEventListener("click", ()=>window.print());

  (async function initExport(){
    try{
      const downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
      if(downloads){ $("#exportBtn").style.display=""; $("#exportBtn").addEventListener("click", ()=>doExport(downloads)); }
      else { promotePrintBtn(); }
    }catch(e){
      promotePrintBtn();
    }
  })();
  function promotePrintBtn(){
    // Le téléchargement natif n'existe que dans l'aperçu artefact de Claude. Sur un site
    // normal (GitHub Pages, ouverture directe du fichier...) l'impression navigateur
    // fonctionne sans restriction : on la met simplement en avant, sans message d'erreur.
    const pb = $("#printBtn");
    pb.classList.remove("secondary");
    pb.textContent = "🖨 Imprimer / Enregistrer en PDF";
  }

  async function doExport(downloads){
    const status=$("#exportStatus");
    status.textContent = "Préparation du fichier…";
    paintSheet();
    const safeName = (s.identity.name||"fiche-personnage").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "fiche-personnage";
    try{
      await downloads.save({filename: safeName+".html", data: buildExportHTML()});
      status.textContent = "Fiche téléchargée. Ouvrez le fichier dans votre navigateur puis Fichier → Imprimer pour l'enregistrer en PDF.";
    }catch(err){
      const code = err && err.code;
      if(code==="extension_not_enabled" || code==="rejected_extension"){
        try{
          await downloads.save({filename: safeName+".txt", data: buildExportText()});
          status.textContent = "Le format HTML n'est pas autorisé ici : la fiche a été téléchargée en texte brut à la place.";
        }catch(err2){
          status.textContent = "Le téléchargement a échoué. Utilisez « Imprimer directement ».";
        }
      } else if(code==="declined"){
        status.textContent = "";
      } else if(code==="rate_limited"){
        status.textContent = "Une demande de téléchargement est déjà en cours — patientez puis réessayez.";
      } else if(code==="too_large"){
        status.textContent = "La fiche est trop volumineuse pour être téléchargée ici. Utilisez « Imprimer directement ».";
      } else {
        status.textContent = "Le téléchargement a échoué. Utilisez « Imprimer directement ».";
      }
    }
  }

  function buildExportHTML(){
    const title = esc(s.identity.name||"Fiche de personnage") + " — Forge de Personnage";
    const sheetHtml = $("#sheet").innerHTML;
    return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${title}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe4c9;--surface:#fbf4e2;--surface-2:#f2e6c8;--ink:#2b2013;--ink-soft:#5b4c38;--ink-faint:#8a7a5c;--gold:#8a6a1e;--good:#3e6b4f;--danger:#9c2b26;--border:#c9b78e;--border-soft:#ddd0aa}
*{box-sizing:border-box}
body{margin:0;padding:2rem;background:var(--bg);color:var(--ink);font-family:"Spectral",serif;line-height:1.5}

.trackcard .sub{font-size:.68rem;color:var(--ink-faint);margin-top:.35rem}
.pillrow{display:flex;flex-wrap:wrap;gap:.3rem}
.badge{display:inline-flex;align-items:center;gap:.3em;font-size:.72rem;border-radius:99px;padding:.15em .65em;border:1px solid var(--border);color:var(--ink-soft);background:var(--surface)}
.badge.pos{color:var(--good);border-color:var(--good)}
.badge.neg{color:var(--danger);border-color:var(--danger)}
